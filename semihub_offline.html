/* ===== v7 디자인 · 오늘 화면 · 내 프로필 ===== */
.navgroup{margin:18px 10px 6px;font-size:10px;font-weight:800;letter-spacing:1.4px;color:#6f86a6;text-transform:none}

.hero{padding:26px 30px!important}.hero h2{font-size:26px!important;line-height:1.35!important;margin:8px 0!important}.hero p{font-size:13px!important;max-width:720px}

.me-chip:hover{border-color:#2ee6c4}

.me-group{margin:12px 0}.me-group>b{font-size:12px;color:#5e6e85}

.pp-stages{margin:8px 0;border:1px dashed #d9e2ee;border-radius:10px;padding:8px 12px}.pp-stages summary{cursor:pointer;font-size:12px;font-weight:700;color:#486078}
.pp-stage{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;margin:8px 0}.pp-stage .select{flex:0 1 auto;max-width:none;width:auto}.pp-stage textarea{flex:1 1 100%}

/* v7.1 체크리스트·시험 기록 */
.me-check{display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:14px}
.me-check input{width:16px;height:16px}
.me-weak td{background:#fff4e5;font-weight:600}

/* ===== v7.2 디자인 리프레시 =====
   참고: 토스(단일 강조색·12~14px 둥근 면·평평한 카드·큰 글씨), Linear(얇은 테두리·촘촘한 사이드바·활성 메뉴만 옅은 색),
   Notion(종이 같은 중립색·작은 섹션 라벨). 마크업은 그대로 두고 이 블록이 앞의 스타일을 덮어쓴다. */
:root{--bg:#f6f7f9;--surface:#fff;--line:#e5e8eb;--line2:#f2f4f6;--ink:#191f28;--ink2:#4e5968;--ink3:#8b95a1;
  --accent:#2f6bff;--accent-d:#1f55e0;--accent-soft:#eaf1ff;--ok:#0f9d58;--ok-soft:#e6f6ee;--warn:#d9730d;--warn-soft:#fff3e0;--bad:#e5484d;--bad-soft:#ffe9ea;
  --r:14px;--r-sm:10px;--ease:cubic-bezier(.22,1,.36,1)}
:root{font-family:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
body{background:var(--bg);font-size:14px;line-height:1.55}
/* 사이드바: 밝은 면 + 얇은 경계, 활성 항목만 옅은 파랑 */
.sidebar{background:#fff;color:var(--ink2);border-right:1px solid var(--line);width:236px;padding:18px 12px}
.brand{color:var(--ink);font-size:18px;font-weight:800;letter-spacing:-.03em;padding:6px 10px 22px;gap:10px}
.brandmark{background:var(--accent);color:#fff;border-radius:10px;width:32px;height:32px;padding:0;display:grid;place-items:center;font-size:15px}
.navgroup{margin:20px 10px 6px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--ink3)}
.nav{color:var(--ink2);padding:9px 10px;border-radius:9px;font-size:14px;font-weight:600;gap:10px;margin-bottom:2px;transition:background .15s var(--ease),color .15s}
.nav i{font-size:16px;min-width:20px;color:var(--ink3);text-align:center}
.nav:hover{background:var(--line2);color:var(--ink)}
.nav.active{background:var(--accent-soft);color:var(--accent-d);box-shadow:none}
.nav.active i{color:var(--accent)}
.sidebarfoot{border-top:1px solid var(--line);color:var(--ink3);font-size:11.5px}
/* 본문 폭과 제목 */
.main{max-width:1240px;padding:32px clamp(18px,3.2vw,48px) 80px}
.topbar{margin-bottom:22px}
.topbar h1{font-size:28px;font-weight:800;letter-spacing:-.035em;color:var(--ink);margin:4px 0 2px}
.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.02em}
.subtitle{color:var(--ink3);font-size:13.5px}
/* 면(카드): 그림자 대신 얇은 테두리 */
.panel,.company,.news-card,.metric,.td-card,.pp-card,.role-card,.role-search-area,.jobs-summary>div,.tech-stat,.posting,.inset{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:none}
.panel{padding:22px}.panel h3{font-size:17px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.company:hover,.role-card:hover,.pp-card:hover,.posting:hover,.td-card:hover{transform:none;box-shadow:none;border-color:#c9ced6}
.company,.role-card,.pp-card,.posting,.td-card{transition:border-color .15s var(--ease)}
.td-card:first-child{border-top:1px solid var(--line);position:relative}
.td-head h3{font-size:15px;font-weight:700}
.td-more{color:var(--accent);font-weight:700}
.td-list li{border-bottom:1px solid var(--line2)}.td-list a{color:var(--ink)}
.inset{background:var(--bg);border:0;border-radius:12px}
.pp-card.pp-hot{border-color:#f4c27a;background:#fffaf1}
.metric b,.value,.tech-stat b{font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:var(--ink)}
.tech-stat b{color:var(--accent)}
/* 히어로·배너: 그라데이션 대신 한 가지 진한 면 */
.hero,.tech-banner,.quiz-panel{background:#191f28!important;border-radius:18px;color:#fff}
.hero:after{display:none}
.hero .eyebrow{color:#8fb3ff}.hero p{color:#b0b8c1}
.quiz-primary{background:#fff!important;color:var(--ink)!important}
.quiz-choice{background:#2a313c;border-color:#3b4452;color:#cfe0ff}.quiz-choice.chosen{background:#35507f;border-color:#6f9bff}
.quiz-progress span,.quiz-result-bar span{background:#6f9bff}
/* 버튼·입력: 토스식(회색 면 / 단일 파랑) */
.button{background:var(--line2);border:1px solid transparent;color:var(--ink);border-radius:var(--r-sm);padding:10px 14px;font-size:13px;font-weight:650;transition:background .15s,transform .1s}
.button:hover{background:#e9ecef;border-color:transparent}.button:active{transform:scale(.98)}
.button.primary{background:var(--accent);color:#fff;border-color:transparent}.button.primary:hover{background:var(--accent-d)}
.button.ghost{background:transparent;color:var(--accent)}
.button:disabled{opacity:.5;cursor:not-allowed}
.input,.select,textarea.select{background:var(--line2);border:1px solid transparent;border-radius:var(--r-sm);padding:11px 13px;color:var(--ink);font-size:14px;transition:box-shadow .15s,background .15s}
.input:focus,.select:focus,textarea.select:focus{background:#fff;box-shadow:0 0 0 2px var(--accent) inset}
.input::placeholder,.select::placeholder{color:var(--ink3)}
.link,.cardfoot button,.role-link{color:var(--accent)}
/* 태그·칩 */
.tag{border-radius:6px;background:var(--line2);color:var(--ink2);padding:4px 8px;font-size:11.5px;font-weight:650}
.tag.green{background:var(--ok-soft);color:var(--ok)}.tag.orange{background:var(--warn-soft);color:var(--warn)}.tag.blue{background:var(--accent-soft);color:var(--accent-d)}

  function trend(tests) {
    const pts = (tests || []).filter(t => +t.total > 0 && t.date).map(t => ({ d: t.date, v: Math.round(+t.correct / +t.total * 100), k: t.kind })).sort((a, b) => a.d.localeCompare(b.d));

    const n = new Date(), y = n.getFullYear(), m = n.getMonth(), first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
    const ym = y + '-' + String(m + 1).padStart(2, '0'), map = {};

})();

function result(){let list=scores(),best=list[0];return `<div class="quiz-inner"><div class="quiz-step">MY SEMICONDUCTOR FIT</div><h3>추천 직무군 결과</h3><p class="quiz-result-lead">가장 높은 선호도 일치 분야는 <b>${escape(best.name)}</b>이야.</p><div class="quiz-results">${list.map((r,i)=>`<div class="quiz-result"><div class="quiz-result-label"><span>${i+1}. ${escape(r.name)}</span><b>${r.score}%</b></div><div class="quiz-result-bar"><span style="width:${r.score}%"></span></div></div>`).join('')}</div><p class="role-disclaimer"><b>주의:</b> 이는 20개 문항에 대한 주관적 답변을 가중 평균한 <b>선호도 일치 지표</b>야. 표준화된 적성검사·기업 채용 평가·합격 확률이 아니며 정답/오답은 없어.</p><div class="quiz-actions"><button class="button primary" data-quiz-explore="${escape(best.category)}">1순위 직무 살펴보기 →</button><button class="button" data-quiz-restart>다시 검사</button></div></div>`}
function quizPanel(){return `<div class="quiz-panel"><div class="quiz-title"><span>✦ CAREER MATCH</span><small>직무 적합도</small></div>${state.showResults?result():state.quizStep<0?quizIntro():quizQuestion()}</div>`}
function cards(){let found=roleList();return `<div class="roles-result-line"><b>검색 결과 ${found.length}개</b><span>카테고리별 직무 설명과 공식 원문 연결</span></div><div class="role-grid">${found.map(roleCard).join('')||'<div class="empty">검색된 직무가 없습니다. 다른 기술·직무 키워드로 찾아보세요.</div>'}</div>`}
function page(){return `<div class="topbar"><div><div class="eyebrow">SEMICONDUCTOR CAREER GUIDE</div><h1>반도체 직무</h1><div class="subtitle">카테고리 검색으로 직무를 이해하고, 20문항으로 나에게 맞는 분야를 탐색해보세요.</div></div></div><section class="role-layout"><div class="role-search-area"><div class="role-search-header"><span>⌕ 직무 탐색</span><b>${roles.length}개 직무</b></div><input class="input role-input" id="roleSearch" placeholder="예: 패키징, SI, PI, 공정, 장비사, EDA..." value="${escape(state.search)}" aria-label="반도체 직무 검색"><div class="role-cats" id="roleCats">${cats.map(c=>`<button data-role-cat="${escape(c)}" class="role-chip ${state.cat===c?'active':''}">${escape(c)}</button>`).join('')}</div><div class="role-hint">공식 기업 직무 소개를 바탕으로 교육용 세부 직무로 재분류했어. 회사마다 실제 공고명과 담당 범위는 달라질 수 있어.</div></div><aside class="quiz-area">${quizPanel()}</aside></section><section id="roleResults">${cards()}</section><div class="note">근무 방식: <b>주간 상근</b>은 일반적인 주간 근무 경향, <b>교대·당직 가능</b>은 라인/고객 지원이 필요한 경우의 가능성을 뜻해. 확정 여부는 개별 채용공고에서 확인해 줘. <a class="link" href="${safe('https://www.samsungcareers.com/subsid/detail/C10CAH')}" target="_blank">삼성 DS 직무 공식 원문 ↗</a> · <a class="link" href="${safe('https://talent.skhynix.com/hub/ko/job/introduce')}" target="_blank">SK하이닉스 직무 공식 원문 ↗</a></div>${state.current?detail(roles.find(x=>x.id===state.current)):''}`}
function bind(render){let search=document.getElementById('roleSearch');if(search){search.addEventListener('input',()=>{state.search=search.value;document.getElementById('roleResults').innerHTML=cards()});}document.querySelectorAll('[data-role-cat]').forEach(b=>b.addEventListener('click',()=>{state.cat=b.dataset.roleCat;render()}));const results=document.getElementById('roleResults');if(results)results.addEventListener('click',e=>{const b=e.target.closest('[data-role-id]');if(b){state.current=b.dataset.roleId;render()}});document.querySelectorAll('[data-role-close]').forEach(b=>b.addEventListener('click',()=>{state.current=null;render()}));let overlay=document.getElementById('roleOverlay');if(overlay)overlay.addEventListener('click',e=>{if(e.target===overlay){state.current=null;render()}});
let start=document.querySelector('[data-quiz-start]');if(start)start.onclick=()=>{state.quizStep=0;state.showResults=false;render()};document.querySelectorAll('[data-quiz-answer]').forEach(b=>b.onclick=()=>{state.answers[state.quizStep]=Number(b.dataset.quizAnswer);render()});let back=document.querySelector('[data-quiz-back]');if(back)back.onclick=()=>{state.quizStep=Math.max(0,state.quizStep-1);render()};let next=document.querySelector('[data-quiz-next]');if(next)next.onclick=()=>{if(state.answers[state.quizStep]==null)return;if(state.quizStep===quiz.questions.length-1){if(state.answers.every(x=>x!=null))state.showResults=true}else state.quizStep++;render()};let restart=document.querySelector('[data-quiz-restart]');if(restart)restart.onclick=()=>{state.quizStep=-1;state.answers.fill(null);state.showResults=false;render()};let explore=document.querySelector('[data-quiz-explore]');if(explore)explore.onclick=()=>{state.cat=explore.dataset.quizExplore;state.search='';state.current=null;render();document.getElementById('roleResults')?.scrollIntoView({behavior:'smooth'})};}
state.quizStep=-1;
window.SEMI_ROLES_UI={page,bind,count:roles.length};
})();

</script><script>
(()=>{
'use strict';const catalog=(window.SEMI_VERIFIED_JOBS||{jobs:[]}).jobs||[];
const state={mine:false,sort:'new',search:'',status:'all',level:'all',source:'all',viewCompanies:false};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>typeof u==='string'&&u.startsWith('https://')?esc(u):'#';
function normDate(s){const str=String(s||'');if(/^\d{8}$/.test(str))return `${str.slice(0,4)}-${str.slice(4,6)}-${str.slice(6,8)}`;const m=str.match(/20\d\d[-./]\d{1,2}[-./]\d{1,2}/);if(m){let p=m[0].replace(/[./]/g,'-').split('-');return `${p[0]}-${p[1].padStart(2,'0')}-${p[2].padStart(2,'0')}`}return ''}
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function dateDiff(d){if(!d)return NaN;return Math.round((Date.parse(today()+'T00:00:00+09:00')-Date.parse(d+'T00:00:00+09:00'))/86400000)}
function isNew(j){const d=normDate(j.postedDate);return !!d&&dateDiff(d)>=0&&dateDiff(d)<5}
function ended(j){let d=normDate(j.deadline);return Boolean(d&&d<today())}
function toUnified(j){return {rolling:!!j.rolling,id:j.id||j.url,title:j.title,company:j.company||'',category:j.category||'',level:j.level||'미분류',location:j.location||'',date:normDate(j.postedDate)||normDate(j.applyStart)||normDate(j.date),postedDate:normDate(j.postedDate)||'',deadline:normDate(j.deadline)||'',dateBasis:j.postedDate?'공고 등록일':(j.dateBasis||'등록일 확인 전'),url:j.url,source:j.source||'',note:j.note||''}}
function data(live){let arr=catalog.map(toUnified);for(const r of live.jobs||[]){const d=normDate(r.date);if(!d||d<'2026')continue;arr.push(toUnified({...r,postedDate:r.collector?(r.postedDate||''):d,applyStart:r.applyStart||d,category:r.category||'반도체 관련',level:r.level||'모집 유형 확인',source:r.source||'고용24 OpenAPI',note:r.collector?(r.note||''):'고용24 수집 공고. 실제 지원 상태는 원문에서 확인'}))}const used=new Set();return arr.filter(j=>{const key=(j.url||'')+'|'+(j.title||'');if(used.has(key)||!j.date.startsWith('2026'))return false;used.add(key);return true}).sort((a,b)=>b.date.localeCompare(a.date)||a.company.localeCompare(b.company))}
function filtered(live){return data(live).filter(j=>{const q=state.search.trim().toLowerCase();return (!q||[j.title,j.company,j.category,j.level,j.location].join(' ').toLowerCase().includes(q))&&(state.status==='all'||(state.status==='open'?!ended(j)&&(!!j.deadline||j.rolling):ended(j)))&&(state.level==='all'||j.level.includes(state.level))&&(state.source==='all'||(state.source==='official'?j.source==='기업 공식 채용 공고':j.source!=='기업 공식 채용 공고'))&&(!state.mine||(window.SEMI_ME&&window.SEMI_ME.matchJob(j)))})}
function card(j){return `<article class="posting"><div class="posting-new">${isNew(j)?'<span class="posting-badge-new">NEW</span>':'<span></span>'}</div><div class="posting-body"><div class="posting-meta"><span class="posting-company">${window.SEMI_VIS?window.SEMI_VIS.avatar(j.company||'?',24)+' ':''}${esc(j.company||'기업 미확인')}</span><span class="tag">${esc(j.level)}</span><span class="tag ${ended(j)?'orange':'green'}">${!j.deadline?(j.rolling?'상시·마감일 미표시':'마감 확인 전'):ended(j)?'마감일 지남':'마감일 미경과'}</span></div><h3>${esc(j.title)}</h3><p class="subtitle">${esc(j.category||'반도체 관련')} · ${esc(j.location||'근무지 미확인')}</p><div class="posting-dates"><span>${esc(j.dateBasis)} <b>${esc(j.date||'확인 전')}</b></span><span>마감 <b>${esc(j.deadline||'공고 원문 확인')}</b></span><span>${esc(j.source)}</span></div>${j.note?`<p class="posting-note">${esc(j.note)}</p>`:''}</div><div class="posting-actions"><a class="button posting-open" href="${safe(j.url)}" target="_blank" rel="noopener noreferrer">공고 원문 ↗</a>${window.SEMI_PREP?(window.SEMI_PREP.tracked(j.url)?'<button class="button" disabled>추적 중 ✓</button>':`<button class="button" data-track-add="1" data-co="${esc(j.company)}" data-ti="${esc(j.title)}" data-url="${esc(j.url)}" data-dl="${esc(j.deadline)}">지원 추적</button>`):''}</div></article>`}
function body(live){let rows=filtered(live);if(state.sort==='deadline')rows=rows.slice().sort((a,b)=>(ended(a)-ended(b))||(a.deadline||'9999').localeCompare(b.deadline||'9999'));return `<div class="posting-count">검색된 2026년 공고 <b>${rows.length}건</b> · 최신 접수/게시 시작일 순</div><div class="posting-list">${rows.map(card).join('')||'<div class="empty">검색 결과가 없습니다. 공식 기업 채용 페이지에서도 공고를 확인해 보세요.</div>'}</div>`}
function careers(companies){return `<div class="panel company-career-panel"><div class="section-head"><h3>기업별 공식 채용 경로</h3><span class="subtitle">${companies.length}개 기업 · 공고 자체가 아닌 접속 경로</span></div><p class="subtitle">고용24 API에 올라오지 않은 기업 채용은 아래 공식 홈페이지에서 직접 확인해 줘. 링크가 있다고 채용 중이라는 뜻은 아니야.</p><input class="input" id="jobsCompanySearch" placeholder="기업명으로 채용 경로 찾기"><div id="jobsCompanyRows" class="company-career-rows">${companies.slice(0,12).map(coRow).join('')}</div></div>`}
function coRow(c){return `<div class="career-row"><div><b>${esc(c.name)}</b><span class="muted">${esc(c.country)} · ${esc(c.segment)}</span></div><a href="${safe(c.career||c.homepage)}" target="_blank" rel="noopener noreferrer">${c.career?'채용 페이지':'공식 사이트'} ↗</a></div>`}
function statusPanel(live){const c=(live&&live.collectors)||{},w=(live&&live.careerWatch)||{};const rows=Object.values(c);
const t=x=>x?esc(String(x).replace('T',' ').slice(0,16)):'-';
const body=rows.length?rows.map(r=>`<div class="career-row"><div><b>${esc(r.label)}</b><span class="muted">${r.status==='ok'?'정상 · '+r.count+'건 · '+t(r.checkedAt):'수집 실패(이전 결과 유지, '+r.count+'건) · '+esc(r.error)}</span></div><span class="tag ${r.status==='ok'?'green':'orange'}">${r.status==='ok'?'정상':'오류'}</span></div>`).join(''):'<div class="empty">아직 기업 채용 사이트 수집 기록이 없어. 로컬 서버에서 「지금 업데이트」를 한 번 실행해 줘.</div>';
const ch=(w.changed||[]).map(x=>`<div class="career-row"><div><b>${esc(x.name)}</b><span class="muted">채용 페이지 변경 감지 · ${t(x.changedAt)}</span></div><a href="${safe(x.url)}" target="_blank" rel="noopener noreferrer">채용 페이지 ↗</a></div>`).join('');
const sum=w.total?`<p class="subtitle">변경 감지 대상 ${w.total}개 기업 중 정상 ${w.ok} · <b>JS 페이지라 감지 불가 ${w.jsOnly}</b> · 접속 오류 ${w.error} (감지 기준: ${t(w.checkedAt)})</p>`:'';
return `<div class="panel company-career-panel"><div class="section-head"><h3>기업 채용 사이트 수집 현황</h3><span class="subtitle">삼성·SK·DB하이텍·ASML·TEL·Lam·AMAT·KLA 전용 수집</span></div>${body}<div class="section-head" style="margin-top:18px"><h3>나머지 기업 채용 페이지 변경 감지</h3></div>${ch||'<div class="empty">변경이 감지된 페이지가 없어.</div>'}${sum}<p class="subtitle">변경 감지는 공고 내용을 읽는 것이 아니라 페이지가 바뀌었다는 신호만 줘. 공고는 반드시 원문에서 확인해.</p></div>`}
function page(live,companies){const arr=data(live);return `<div class="topbar"><div><div class="eyebrow">2026 SEMICONDUCTOR RECRUITMENT</div><h1>반도체 채용공고</h1><div class="subtitle">2026년 공식 확인 공고 및 선택적 고용24 수집 공고를 최신순으로 검색</div></div></div><div class="jobs-summary"><div><small>공식 확인된 2026 공고 사례</small><b>${catalog.length}건</b></div><div><small>자동 수집된 공고(고용24·기업 공식)</small><b>${arr.length-catalog.length}건</b></div><div><small>NEW 표시</small><b>공식 등록 후 5일 이내</b></div></div><div class="note notice-warning"><b>수집 범위:</b> 등록된 일부 공고와 고용24 API 공고만 보여줘. 국내·해외 반도체 기업의 <b>2026년 전체 공고를 빠짐없이 수집한 목록은 아니야.</b> 공식 공고는 접수 시작일과 실제 게시일이 다를 수 있어. 게시일 미확인 사례는 <b>NEW로 표시하지 않아.</b> 오늘 날짜와 공고 마감일로 구분한 상태는 실제 지원 가능 여부의 보증이 아니야.</div><div class="jobs-filters"><input class="input" id="jobsSearch" placeholder="회사·패키징·SI/PI·공정·지역 등 공고 검색" value="${esc(state.search)}"><label class="me-toggle"><input type="checkbox" id="jobsMine" ${state.mine?'checked':''}> 내 관심만</label><select class="select" id="jobsSort"><option value="new">최신순</option><option value="deadline" ${state.sort==='deadline'?'selected':''}>마감 임박순</option></select><select class="select" id="jobsStatus"><option value="all">전체 공고</option><option value="open" ${state.status==='open'?'selected':''}>마감일 미경과</option><option value="closed" ${state.status==='closed'?'selected':''}>마감일 지남</option></select><select class="select" id="jobsLevel"><option value="all">신입·경력 전체</option><option value="신입" ${state.level==='신입'?'selected':''}>신입</option><option value="경력" ${state.level==='경력'?'selected':''}>경력</option><option value="장학생" ${state.level==='장학생'?'selected':''}>장학생</option></select><select class="select" id="jobsSource"><option value="all">전체 출처</option><option value="official" ${state.source==='official'?'selected':''}>기업 공식 공고 사례</option><option value="api" ${state.source==='api'?'selected':''}>고용24 자동 수집</option></select></div><div class="jobs-toolbar"><div><b>등록 날짜 최신순</b><p class="subtitle">${(live&&live.lastSuccess)?'마지막 수집: '+esc(live.lastSuccess):'자동 수집 미연결 · 기본 검증 사례만 표시'}</p></div><button class="button" data-refresh>↻ 지금 업데이트</button></div><div id="jobsResults">${body(live)}</div>${statusPanel(live)}${careers(companies)}`}
function bind(render,live,companies){{const m=document.getElementById('jobsMine');if(m)m.onchange=()=>{state.mine=m.checked;document.getElementById('jobsResults').innerHTML=body(live)};const so=document.getElementById('jobsSort');if(so)so.onchange=()=>{state.sort=so.value;document.getElementById('jobsResults').innerHTML=body(live)}}let s=document.getElementById('jobsSearch');if(s)s.addEventListener('input',()=>{state.search=s.value;document.getElementById('jobsResults').innerHTML=body(live)});[['jobsStatus','status'],['jobsLevel','level'],['jobsSource','source']].forEach(([id,k])=>{let x=document.getElementById(id);if(x)x.onchange=()=>{state[k]=x.value;document.getElementById('jobsResults').innerHTML=body(live)}});let c=document.getElementById('jobsCompanySearch');if(c)c.oninput=()=>{let q=c.value.trim().toLowerCase();document.getElementById('jobsCompanyRows').innerHTML=companies.filter(x=>x.name.toLowerCase().includes(q)).slice(0,25).map(coRow).join('')||'<div class="empty">검색된 기업 없음</div>'}}
window.SEMI_JOBS_UI={data,page,bind,isNew,count:catalog.length};

function matchTopics(s){let t=String(s||'').toLowerCase();const aliases={hbm4:['hbm','dram','zhbm'],hybrid:['본딩','bonding'],tsv:['tsv'],cowos:['cowos','interposer','패키징','packaging'],si:['si/pi','signal integrity','power integrity'],highna:['high na','high-na','euv','노광','photomask'],gaa:['gaa','2nm','nanosheet'],backside:['bspdn','backside power'],cpo:['cpo','photonics','포토닉스'],cxl:['cxl'],hbf:['hbf'],nand:['nand','낸드'],etch:['etch','식각'],ald:['ald','deposition','증착'],glass:['유리기판','glass substrate'],pim:['pim','cim'],thermal:['cooling','thermal','발열'],inspection:['계측','검사','metrology']};return Object.entries(aliases).filter(([,vs])=>vs.some(x=>t.includes(x))).map(([k])=>k).slice(0,6)}
function legacyNews(live){return Array.isArray(live?.techNews)?live.techNews:[]}
function normalize(n,i){return {id:n.id||'r'+i,title:n.title||'',date:(n.date||'').slice(0,10),source:n.source||n.company||'뉴스',company:n.company||n.source||'뉴스',url:n.url||'',category:legacyCategory[n.category]||n.category||'반도체 산업',topics:Array.isArray(n.topics)?n.topics:matchTopics(n.title||''),summary:n.summary||'',kind:n.kind||'RSS 기사',education:n.education||'',aiAnalysis:n.aiAnalysis||'',analysisMode:n.analysisMode||'',lang:n.lang||( /[가-힣]/.test(n.title||'')?'ko':'en')}}
function key(n){return n.title.toLowerCase().replace(/[^\w가-힣]/g,'').slice(0,160)+'|'+n.date}
function items(live){const all=[...archive,...seeds,...legacyNews(live)].map(normalize).filter(n=>n.title&&n.url&&n.date>='2026-01-01');const map=new Map();for(const n of all)if(!map.has(key(n)))map.set(key(n),n);return [...map.values()].sort((a,b)=>b.date.localeCompare(a.date)||a.title.localeCompare(b.title,'ko'))}
function filtered(live){const q=state.query.trim().toLowerCase();return items(live).filter(n=>state.category==='전체'||n.category===state.category||(state.category==='첨단 패키징'&&n.topics.some(t=>byId[t]?.category==='패키징'))).filter(n=>state.source==='전체'||n.source===state.source||n.company===state.source).filter(n=>state.month==='전체'||n.date.startsWith(state.month)).filter(n=>state.lang==='전체'||n.lang===state.lang).filter(n=>!q||[n.title,n.source,n.company,n.category,n.summary,...n.topics.map(t=>byId[t]?.title||t)].join(' ').toLowerCase().includes(q)).filter(n=>!state.mine||(window.SEMI_ME&&window.SEMI_ME.matchNews(n)>0))}

function newsList(live){const result=filtered(live),rows=result.slice(0,state.shown);return `<div class="tech-summary">2026년 검색 결과 <b>${result.length.toLocaleString('ko-KR')}</b>건 · 신규 기사 자동 학습 노트 · 날짜 최신순 · ${archive.length?'온라인 수집 데이터 포함':'오프라인 기본 기사'}</div><div class="tech-news-list">${rows.map(n=>`<div class="tech-news-row"><button class="tech-news-title" data-tech-open="${esc(n.id)}"><span class="tech-ns">${window.SEMI_ME&&window.SEMI_ME.matchNews(n)>0?'<span class="me-star">★ 내 관심</span>':''}${esc(n.source)} <span class="tech-small-badge">${esc(n.category)}</span>${n.aiAnalysis?'<span class="tech-ai-mark">AI 해설</span>':'<span class="tech-auto-mark">학습 해설</span>'}</span><strong>${esc(n.title)}</strong><span class="tech-newshint">기사 설명·기술 연결 보기</span></button><a class="tech-source-icon" href="${safe(n.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(n.title)} 원문 기사 새 창 열기">↗ 원문</a><span class="tech-date">${esc(n.date)}</span></div>`).join('')||'<div class="empty">조건에 해당하는 기사가 없습니다. 연도·월·검색어를 바꿔보세요.</div>'}</div>${rows.length<result.length?`<div class="tech-more"><button class="button" data-tech-more>기사 ${Math.min(60,result.length-rows.length)}건 더 보기 (${rows.length}/${result.length})</button></div>`:''}`}

function detailNews(live){if(!state.selected)return '';const n=items(live).find(x=>x.id===state.selected);if(!n)return '';const related=(n.topics||[]).map(x=>byId[x]).filter(Boolean);const notes=related.map(t=>`<section class="tech-learn-block"><div class="tech-learn-head"><strong>${esc(t.title)}</strong><span>${esc(t.category)}</span></div><p>${esc(t.summary)}</p><p class="tech-study-chain"><b>공정·구조 연결</b> ${esc(t.process)}</p><p class="tech-study-impact"><b>왜 중요한가?</b> ${esc(t.impact)}</p><button class="tech-rel-btn" data-tech-topic="${esc(t.id)}">연관 기술 전체 보기 →</button></section>`).join('');const learn=n.aiAnalysis||n.education||'해당 기사에서 등장하는 기술의 기본 개념은 아래 연결된 기술 자료에서 살펴보세요. 세부 사실은 기사 원문으로 확인하세요.';return `<div class="tech-modal-wrap" data-tech-closebg><div class="tech-modal" role="dialog" aria-modal="true" aria-label="기사 기술 해설"><button class="tech-x" data-tech-close aria-label="닫기">×</button><div class="tech-overline">2026 ARTICLE → TECHNOLOGY EXPLAINED</div><h2>${esc(n.title)}</h2><div class="tech-detail-meta">${esc(n.source)} · ${esc(n.date)} · ${esc(n.category)}</div><div class="tech-quote"><b>원문에서 제공된 공개 설명</b><p>${esc(n.summary||'원문 요약이 제공되지 않았습니다. 제목과 기술 카테고리로 기본 학습 해설을 만들었습니다.')}</p></div><a class="tech-original" href="${safe(n.url)}" target="_blank" rel="noopener noreferrer">↗ 기사 원문 열기 (외부 사이트)</a><div class="tech-dotted"><b>${n.aiAnalysis?'✦ 수집 시 자동 생성한 AI 해설':'✦ 수집 시 자동 생성한 기술 학습 해설'}</b><span>${n.aiAnalysis?'Gemini API로 생성 · 오류 가능':'무료 규칙 기반 · 원문 분석 아님'}</span></div><div class="tech-learn-block tech-education">${esc(learn)}</div>${notes?`<div class="tech-dotted"><b>관련 공정·장비·기술 연결</b><span>학부생용 개념 학습</span></div>${notes}`:''}${window.SEMI_PREP?window.SEMI_PREP.answerBox(n.id):''}${window.SEMI_ME?window.SEMI_ME.insightBox(n):''}<div class="tech-ai-box"><div class="tech-ai-head"><b>✧ AI로 심화 분석</b><span>Gemini 무료 API · 로컬 서버</span></div><p>기사 제목·RSS 공개 요약을 바탕으로 분석합니다. 기사 본문을 모두 읽은 것처럼 설명하지 않습니다. 자동 분석을 예약 실행하려면 환경변수 GEMINI_API_KEY를 설정하세요.</p><button class="  function bindItems(){document.querySelectorAll('[data-tech-open]').forEach(n=>n.onclick=()=>{state.selected=n.dataset.techOpen;state.selectedTopic=null;state.aiText='';state.aiError='';rerender()});document.querySelectorAll('[data-tech-topic]').forEach(n=>n.onclick=()=>{state.selectedTopic=n.dataset.techTopic;state.selected=null;state.aiText='';rerender()});document.querySelectorAll('[data-tech-more]').forEach(n=>n.onclick=()=>{state.shown+=60;const box=el('techItems');if(box){box.innerHTML=newsList(live);bindItems()}})}

    // ---- 장비
    ['equipment', 'CCP와 ICP 플라즈마 소스의 차이는?',
      'CCP는 평행판 전극에 RF를 걸어 플라즈마를 만들고 밀도와 이온 에너지가 서로 연동됩니다. ICP는 코일의 유도 전자기장으로 고밀도 플라즈마를 만들고, 기판 바이어스를 따로 걸어 밀도(소스 전력)와 이온 에너지(바이어스 전력)를 독립적으로 제어할 수 있습니다.'],
    ['equipment', '설비 가동률 관련 지표 MTBF, MTTR, Uptime을 설명하세요.',
      'MTBF는 고장 사이의 평균 시간, MTTR은 수리에 걸리는 평균 시간입니다. 가동률(Availability) ≈ MTBF / (MTBF + MTTR) 입니다. 가동률을 높이려면 예방보전(PM)으로 MTBF를 늘리고 부품·절차 표준화로 MTTR을 줄입니다.'],
    ['equipment', '진공 장비에서 압력 영역별로 쓰이는 게이지·펌프 예를 말해보세요.',
      '저진공 영역은 러핑펌프(드라이펌프)와 피라니·캐패시턴스 게이지, 고진공은 터보분자펌프·크라이오펌프와 이온 게이지를 씁니다. 공정 챔버 압력의 정밀 제어에는 저진공 구간에서 정확도가 높은 캐패시턴스 마노미터를 사용합니다.'],
    // ---- 분석/품질
    ['analysis', '불량 분석(FA)의 일반적인 순서와 대표 기법은?',
      '전기적 불량 확인 → 비파괴 분석(X-ray, SAT) → 불량 위치 특정(EMMI, OBIRCH, 열화상) → 물리적 분석(디캡·FIB 단면 → SEM/TEM, EDS 성분 분석) → 원인 추정과 재현 → 대책 순입니다. 비파괴에서 파괴 순서로 진행해 증거 손실을 막는 것이 원칙입니다.'],
    ['analysis', '신뢰성 평가에서 욕조 곡선(bathtub curve)과 번인(Burn-in)의 관계는?',
      '고장률은 초기 불량기(감소) → 우발 고장기(일정) → 마모기(증가)의 욕조 모양입니다. 번인은 높은 온도·전압으로 초기 불량품을 출하 전에 걸러내는 스크리닝입니다. HTOL 같은 수명 시험은 가속 모델(아레니우스)로 사용 조건의 수명을 추정합니다.'],
    ['analysis', 'Cp와 Cpk의 차이는?',
      'Cp = (USL−LSL)/(6σ)는 공정 산포 대비 규격 폭(공정 능력)이고, Cpk = min(USL−μ, μ−LSL)/(3σ)는 평균이 규격 중심에서 치우친 정도까지 반영합니다. Cp가 커도 평균이 치우치면 Cpk는 낮아집니다.'],
    ['analysis', 'Wafer sort(EDS)와 Final test의 차이는?',
      'Wafer sort는 웨이퍼 상태에서 다이별로 프로브 카드로 전기 특성을 검사해 양품·불량을 선별하고 리페어(메모리) 정보를 만듭니다. Final test는 패키징 후 최종 제품 상태로 속도·온도·전압 조건 등 스펙을 검증합니다. 불량 칩을 패키징하기 전에 걸러 비용을 줄이는 것이 sort의 목적입니다.'],
    // ---- 데이터
    ['data', '결함 검출 모델에서 불균형 데이터를 어떻게 다루나요?',
      '불량은 극소수라 정확도(accuracy)만 보면 오해가 생깁니다. Precision·Recall·PR 곡선으로 평가하고, 재샘플링·가중 손실·이상 탐지 접근, 데이터 증강을 씁니다. 불량을 놓치는 비용이 크면 Recall 중심으로 임계값을 조정합니다.'],
    ['data', 'Virtual Metrology(가상 계측)란?',
      '장비 센서 데이터(FDC)와 공정 조건으로 계측 값을 예측해, 모든 웨이퍼를 실제 측정하지 않고도 공정 상태를 모니터링·제어(R2R)하는 기법입니다. 계측 비용·시간을 줄이는 대신 모델 드리프트를 지속적으로 관리해야 합니다.'],
    // ---- 소재/인프라
    ['materials', '배선에 Low-k 절연막이 필요한 이유는?',
      '배선 지연은 RC에 비례합니다. 배선 간 절연막의 유전율(k)을 낮추면 커패시턴스 C와 크로스토크, 전력이 줄어듭니다. 다공성 막은 기계적 강도가 약해 CMP·패키징 시 손상 위험이 있는 것이 과제입니다.'],
    // ---- 공통
    ['common', '1분 자기소개와 지원동기를 말해보세요. (모범답 없음)',
      '답을 외우기보다 구조를 잡으세요: ① 전공·핵심 역량 한 줄 ② 가장 직무와 가까운 경험(프로젝트·수강) 한두 개 ③ 이 회사·직무에서 하고 싶은 일. 숫자나 결과로 말할 수 있는 경험을 앞에 두고, 회사 최근 이슈(뉴스 탭의 1분 답변 활용)와 연결하면 설득력이 올라갑니다.'],
    ['common', '가장 어려웠던 프로젝트와 해결 과정을 설명하세요. (모범답 없음)',
      'STAR 구조(상황-과제-행동-결과)로 정리하세요. 본인이 한 일과 팀이 한 일을 구분하고, 막혔던 지점에서 어떤 가설을 세우고 어떻게 검증했는지, 결과를 수치로 말하고, 다시 한다면 무엇을 바꿀지까지 준비합니다.'],
    ['common', '모르는 질문을 받으면 어떻게 하시겠습니까? (모범답 없음)',
      '아는 만큼의 근거를 먼저 말하고, 모르는 부분은 모른다고 인정한 뒤 어떻게 추론하거나 확인할지를 보여주세요. 아는 척하거나 침묵하는 것보다 사고 과정을 드러내는 편이 낫습니다.'],
    ['design','동기 리셋과 비동기 리셋의 차이와 장단점은?','동기 리셋은 클럭 엣지에서만 반영되어 글리치에 강하고 타이밍 분석이 단순하지만, 리셋 시점에 클럭이 있어야 하고 로직이 조금 늘어납니다. 비동기 리셋은 클럭 없이 즉시 초기화되지만 해제 시점이 클럭 엣지와 가까우면 준안정이 생길 수 있습니다. 그래서 실무에서는 "assert는 비동기, deassert는 동기"인 리셋 동기화기를 자주 씁니다.'],
    ['design','Recovery time과 Removal time이란?','비동기 리셋(또는 set)이 해제되는 시점에 대한 타이밍 조건입니다. Recovery는 클럭 엣지 전에 리셋이 해제되어 있어야 하는 최소 시간(setup과 비슷), Removal은 클럭 엣지 후에 리셋 해제가 유지되어야 하는 최소 시간(hold와 비슷)입니다. 위반하면 플립플롭이 준안정 상태가 될 수 있습니다.'],
    ['design','클럭 skew가 setup과 hold에 미치는 영향은?','데이터를 받는 쪽(capture) 클럭이 보내는 쪽(launch)보다 늦게 도착하면(positive skew) setup 여유는 늘고 hold 여유는 줄어듭니다. 반대로 capture 클럭이 빠르면 setup이 불리해지고 hold는 유리해집니다. 그래서 CTS로 skew를 최소화하거나 의도적으로 활용(useful skew)합니다.'],
    ['design','Clock skew와 jitter의 차이는?','Skew는 같은 클럭 엣지가 서로 다른 플립플롭에 도착하는 시간 차이로 배선·버퍼 지연 때문에 생기며 거의 고정적입니다. Jitter는 클럭 엣지가 이상적인 시점에서 사이클마다 흔들리는 시간 변동으로 PLL 잡음, 전원 잡음 등이 원인이며 통계적으로 다룹니다. 둘 다 타이밍 마진을 줄입니다.'],
    ['design','PVT 코너와 setup/hold 분석 코너의 관계는?','공정(Process), 전압(Voltage), 온도(Temperature) 변동을 코너로 나눕니다. 일반적으로 setup은 가장 느린 조건(slow 공정, 낮은 전압, 높은 온도)에서, hold는 가장 빠른 조건에서 가장 나빠집니다. 다만 미세 공정에서는 저온에서 느려지는 온도 역전 현상이 있어 코너 선택에 주의해야 합니다.'],
    ['design','STA(정적 타이밍 분석)와 동적 시뮬레이션의 차이는?','STA는 입력 벡터 없이 모든 타이밍 경로를 수학적으로 검사하므로 빠르고 빠짐이 없지만, 논리 기능은 검증하지 못하고 제약(SDC)이 틀리면 결과도 틀립니다. 동적 시뮬레이션은 실제 입력으로 기능을 확인하지만 실행한 시나리오만 검증합니다. 그래서 둘을 함께 씁니다.'],
    ['design','False path와 Multicycle path는 무엇인가요?','False path는 실제 동작에서 데이터가 유효하게 전파되지 않아 타이밍 검사를 제외해도 되는 경로입니다(예: 상호 배타적인 모드, 비동기 경계). Multicycle path는 데이터가 한 사이클보다 길게(N 사이클) 걸려도 올바르게 동작하도록 설계된 경로로, 제약으로 N을 지정해 과도한 최적화를 막습니다. 잘못 지정하면 실제 위반을 놓치므로 신중해야 합니다.'],
    ['design','임계 경로(critical path)를 줄이는 방법은?','파이프라인 단계 추가, 리타이밍(레지스터 위치 이동), 연산 병렬화·구조 변경(예: ripple → carry-lookahead), 로직 단계 축소, 셀 사이징·Vt 교체, 합성 제약 조정이 있습니다. 파이프라인을 늘리면 주파수는 오르지만 latency와 면적, 전력이 증가하는 트레이드오프가 있습니다.'],
    ['design','파이프라이닝의 장단점과 해저드를 설명하세요.','명령을 단계로 나눠 겹쳐 실행하면 클럭 주기가 짧아지고 처리량이 늘지만, 한 명령의 latency는 늘고 면적과 제어가 복잡해집니다. 해저드는 구조적(자원 충돌), 데이터(앞 명령 결과를 아직 못 씀, RAW), 제어(분기) 해저드가 있으며 포워딩, 스톨, 분기 예측으로 해결합니다.'],
    ['design','캐시의 구조와 miss 종류를 설명하세요.','캐시는 시간·공간 지역성을 이용해 자주 쓰는 데이터를 가까이 두는 작은 메모리입니다. 매핑 방식은 direct-mapped, set-associative, fully associative가 있고, 쓰기 정책은 write-through와 write-back이 있습니다. Miss는 처음 접근(compulsory), 용량 부족(capacity), 매핑 충돌(conflict)로 나뉩니다.'],
    ['design','Moore 머신과 Mealy 머신의 차이는?','Moore는 출력이 현재 상태에만 의존하고, Mealy는 현재 상태와 입력에 모두 의존합니다. Mealy는 보통 상태 수가 적고 반응이 한 사이클 빠르지만 입력 변화가 출력에 바로 전달되어 글리치와 조합 경로가 생길 수 있습니다. Moore는 출력이 안정적이라 타이밍 분석이 쉽습니다.'],
    ['design','FSM 상태 인코딩(binary, Gray, one-hot)의 트레이드오프는?','Binary는 플립플롭 수가 적지만 디코딩 로직이 큽니다. One-hot은 플립플롭이 상태 수만큼 필요하지만 디코딩이 단순해 빠르고 FPGA에 유리합니다. Gray는 상태 전이 시 한 비트만 바뀌어 전력과 글리치 측면에서 유리할 수 있습니다.'],
    ['design','Ripple-carry 가산기와 Carry-lookahead 가산기의 차이는?','Ripple-carry는 캐리가 비트마다 순차적으로 전달되어 지연이 비트 수에 비례합니다. Carry-lookahead는 generate(G=a·b)와 propagate(P=a⊕b)로 캐리를 병렬 계산해 지연을 크게 줄이는 대신 회로가 커집니다. 실제로는 블록 단위로 계층화해 면적과 속도를 절충합니다.'],
    ['design','2의 보수 덧셈에서 overflow는 어떻게 판단하나요?','부호가 같은 두 수를 더했는데 결과의 부호가 다르면 overflow입니다. 하드웨어에서는 MSB로 들어오는 캐리와 MSB에서 나가는 캐리를 XOR하면 알 수 있습니다. 부호 없는 수의 overflow는 최상위 비트의 carry-out으로 판단합니다.'],
    ['design','곱셈기를 빠르게 만드는 방법은?','Booth 인코딩으로 부분곱 수를 줄이고, Wallace/Dadda 트리 같은 CSA(carry-save adder) 구조로 부분곱을 병렬로 압축한 뒤 마지막에 빠른 가산기로 합칩니다. 속도는 오르지만 배선과 면적이 늘어납니다.'],
    ['design','Combinational 회로의 글리치(hazard)는 왜 생기고 어떻게 막나요?','입력이 바뀔 때 경로마다 지연이 달라 출력이 잠깐 잘못된 값을 내는 현상입니다. 정적 1-hazard는 카르노맵에서 인접한 항 사이에 consensus term을 추가해 제거할 수 있습니다. 글리치가 클럭이나 비동기 리셋으로 가면 치명적이므로 그런 신호는 레지스터로 한 번 거친 값을 씁니다.'],
    ['design','CMOS에서 NAND가 NOR보다 선호되는 이유는?','PMOS는 정공 이동도가 낮아 같은 크기에서 NMOS보다 약합니다. NOR는 PMOS가 직렬로 쌓여 pull-up이 느려지고 면적이 커지는 반면, NAND는 NMOS가 직렬, PMOS가 병렬이라 상대적으로 균형이 좋습니다.'],
    ['design','저전력 설계 기법을 말해보세요.','클럭 게이팅(동적 전력), 파워 게이팅(누설 차단), Multi-Vt(임계 경로만 low-Vt), DVFS(전압·주파수 조절), 오퍼랜드 격리, 메모리 분할이 있습니다. 동적 전력은 α·C·V²·f이므로 전압을 낮추는 것이 가장 효과적이지만 속도가 떨어집니다.'],
    ['design','파워 게이팅을 쓸 때 필요한 셀과 주의점은?','전원이 꺼진 블록의 출력이 떠서 다른 블록에 불확정 값을 주지 않도록 isolation cell이 필요하고, 상태를 보존해야 하면 retention 플립플롭을 씁니다. 전압 도메인이 다르면 level shifter가 필요합니다. 전원 켜기·끄기 시퀀스와 돌입 전류(IR drop)도 관리해야 합니다.'],
    ['design','Multi-Vt 셀은 왜 쓰나요?','Low-Vt는 빠르지만 누설전류가 크고, High-Vt는 느리지만 누설이 작습니다. 타이밍이 빠듯한 임계 경로에만 low-Vt를 쓰고 나머지는 high-Vt로 두면 속도와 누설 전력을 함께 만족시킬 수 있습니다.'],
    ['design','DFT에서 스캔 체인은 무엇인가요?','플립플롭을 테스트 모드에서 하나의 시프트 레지스터처럼 연결해, 내부 상태를 직접 넣고 읽을 수 있게 만든 구조입니다. 스캔 플립플롭은 일반 플립플롭 앞에 MUX가 붙어 있습니다. ATPG 툴이 stuck-at 같은 고장 모델로 테스트 패턴을 만들고, 메모리는 MBIST로 검사합니다.'],
    ['design','Fault coverage란?','생성한 테스트 패턴이 가정한 고장 모델(예: stuck-at-0/1) 중 몇 퍼센트를 검출하는지의 비율입니다. 커버리지가 높을수록 출하 불량률이 낮아지지만 패턴 수와 테스트 시간이 늘어납니다.'],
    ['design','RTL에서 GDSII까지의 디지털 설계 흐름을 설명하세요.','RTL 설계·검증 → 합성(제약 SDC 적용, 게이트 넷리스트 생성) → DFT 삽입 → 배치배선(floorplan, placement, CTS, routing) → 사인오프(STA, 전력, IR drop, 크로스토크) → 물리 검증(DRC, LVS) → GDSII 출력입니다. 단계마다 타이밍 위반이 생기면 이전 단계로 돌아가 수정합니다.'],
    ['design','CTS의 목적은?','칩 전체 플립플롭에 클럭이 최대한 같은 시간에 도착하도록(skew 최소) 클럭 트리를 만드는 것입니다. 이와 함께 지연·전력·클럭 잡음을 관리하고, 클럭 게이팅 셀이 있으면 그 구조도 고려합니다.'],
    ['design','IR drop과 Electromigration은 무엇인가요?','IR drop은 전원 배선의 저항 때문에 셀에 공급되는 전압이 낮아지는 현상으로 지연 증가와 오동작을 일으킵니다. Electromigration은 큰 전류 밀도에서 금속 원자가 이동해 배선이 끊기거나 단락되는 신뢰성 문제입니다. 전원 배선 폭·메시 설계로 대응합니다.'],
    ['design','크로스토크(crosstalk)란?','인접한 배선 사이의 커플링 커패시턴스 때문에 한 배선의 신호 변화가 다른 배선에 영향을 주는 현상입니다. 이웃이 같은 방향·반대 방향으로 바뀌는지에 따라 지연이 줄거나 늘고, 조용한 배선에 글리치가 생길 수도 있습니다. 배선 간격 확대나 shielding으로 줄입니다.'],
    ['design','안테나 효과(antenna effect)란?','제조 중 플라즈마 식각 때 긴 금속 배선이 전하를 모아, 연결된 게이트 산화막이 손상되는 현상입니다. 배선 길이를 제한하고, 상위 금속 층으로 점프하거나 보호 다이오드를 삽입해 해결합니다.'],
    ['design','DRC와 LVS는 무엇을 검사하나요?','DRC는 레이아웃이 공정이 요구하는 최소 폭·간격 같은 설계 규칙을 지키는지 검사합니다. LVS는 레이아웃에서 추출한 회로와 원래의 회로도(넷리스트)가 같은지 비교합니다. 둘 다 통과해야 제조용 데이터로 넘길 수 있습니다.'],
    ['design','SRAM 6T 셀의 구조와 동작을 설명하세요.','서로 맞물린 인버터 두 개(트랜지스터 4개)가 값을 저장하고, 접근 트랜지스터 2개가 워드라인으로 비트라인과 연결합니다. 읽기는 비트라인을 프리차지한 뒤 센스 앰프로 차이를 감지하고, 쓰기는 비트라인을 강하게 구동해 저장 상태를 뒤집습니다. 읽기 안정성(SNM)과 쓰기 능력의 균형이 셀 크기 설계의 핵심입니다.'],
    ['design','SystemVerilog에서 constrained random 검증의 장점은?','제약 조건 안에서 입력을 무작위로 만들어 사람이 생각하지 못한 코너 케이스를 찾을 수 있고, 시나리오 수를 빠르게 늘릴 수 있습니다. 대신 기능 커버리지로 어떤 시나리오를 확인했는지 측정해야 하고, 특정 시나리오는 directed test로 보완합니다.'],
    ['design','UVM의 주요 구성요소를 설명하세요.','Sequence(자극 시나리오)가 Sequencer를 통해 Driver로 전달되어 DUT 인터페이스를 구동하고, Monitor가 인터페이스를 관찰해 트랜잭션으로 만듭니다. Scoreboard가 기대값과 실제값을 비교하고, Agent가 driver·monitor·sequencer를 묶으며, Environment와 Test가 전체를 구성합니다.'],
    ['design','SVA(SystemVerilog Assertion)는 무엇에 쓰나요?','시간에 따른 신호 관계를 속성으로 표현해 시뮬레이션이나 형식 검증에서 자동으로 검사합니다. 예를 들어 "req가 1이면 1~3 사이클 안에 ack가 와야 한다"는 req |-> ##[1:3] ack 처럼 씁니다. 프로토콜 위반을 발생 시점에 바로 잡을 수 있습니다.'],
    ['design','case, casez, casex의 차이와 주의점은?','case는 값이 정확히 같을 때, casez는 z(또는 ?)를 don\'t care로, casex는 x와 z를 모두 don\'t care로 취급합니다. casex는 시뮬레이션에서 x가 들어오면 잘못 매칭되어 버그를 숨길 수 있어 권장하지 않습니다. 우선순위·병렬성을 의도한 대로 쓰려면 unique/priority를 쓰기도 합니다.'],
    ['design','Verilog에서 합성 가능한 코드와 불가능한 코드의 예는?','합성 가능한 것은 조합·순차 always 블록, assign, 일반적인 연산자입니다. 지연 #, initial의 초기화(FPGA 제외 대부분), 파일 입출력($fopen), 무한루프, $display 같은 시스템 태스크는 시뮬레이션 전용입니다. 합성 툴 지원 범위를 항상 확인해야 합니다.'],
    ['design','AXI 프로토콜의 특징을 설명하세요.','읽기 주소(AR), 읽기 데이터(R), 쓰기 주소(AW), 쓰기 데이터(W), 쓰기 응답(B)의 5개 독립 채널로 구성되고, 각 채널은 valid/ready 핸드셰이크로 전송됩니다. 주소와 데이터 채널이 분리되어 있어 burst 전송과 outstanding(응답 전에 다음 요청) 처리가 가능해 높은 대역폭을 낼 수 있습니다.'],
    ['design','valid/ready 핸드셰이크에서 주의할 점은?','valid와 ready가 모두 1인 클럭 엣지에서 전송이 일어납니다. 송신자는 valid를 올린 뒤 ready를 받기 전에 데이터를 바꾸거나 valid를 내리면 안 됩니다. 두 신호가 서로를 기다리는 조합 루프(데드락)가 생기지 않게 설계해야 합니다.'],
    ['design','중재기(Arbiter)에서 고정 우선순위와 라운드로빈의 차이는?','고정 우선순위는 구현이 단순하지만 낮은 우선순위 요청이 계속 밀리는 기아(starvation)가 생길 수 있습니다. 라운드로빈은 순서를 돌려가며 허가해 공정하지만 지연 보장이나 우선 처리가 필요한 경우엔 가중치 같은 변형이 필요합니다.'],
    ['design','Latch를 이용한 time borrowing이란?','래치는 투명한 구간 동안 데이터가 통과하므로, 앞 단계가 느리면 다음 단계 시간에서 여유를 빌려 쓸 수 있습니다. 파이프라인 단계 간 지연 불균형을 흡수해 클럭 주기를 줄일 수 있지만, 타이밍 분석과 검증이 복잡해집니다.'],
    ['design','동기화기 단 수를 늘리면 MTBF가 왜 좋아지나요?','준안정 상태가 해소될 때까지의 확률은 시간이 길수록 지수적으로 줄어듭니다. 동기화기 단을 늘리면 해소에 쓸 수 있는 시간(tr)이 늘어나 MTBF가 지수적으로 증가합니다. 대신 latency가 한 사이클씩 늘어납니다.'],
    ['design','리타이밍(retiming)이란?','논리 기능은 그대로 두고 레지스터를 조합 로직 사이로 옮겨 경로 지연을 균형 있게 맞추는 최적화입니다. 임계 경로를 줄여 클럭 주파수를 높일 수 있지만, 레지스터 개수가 변하고 초기값과 검증 등가성을 신경 써야 합니다.'],
    ['common','왜 설계 직무인가요? 왜 반도체인가요? (모범답 없음)','"좋아서"로 끝내지 말고 계기→검증 경험→직무 연결로 말하세요. 예: 어떤 수업·프로젝트에서 직접 RTL이나 회로를 만들어 보며 느낀 점, 그 경험에서 배운 구체적 역량, 그리고 이 회사의 어떤 제품·기술이 그 역량을 쓰게 되는지를 한 흐름으로 연결합니다.'],
    ['common','왜 이 회사인가요? 경쟁사와 무엇이 다른가요? (모범답 없음)','채용 페이지 문구가 아니라 최근 기사·제품·기술 방향(뉴스 탭 활용)에서 근거를 잡으세요. 경쟁사를 깎아내리지 말고 본인이 하고 싶은 일이 이 회사에서 어떻게 가능한지 구체적으로 말하는 것이 안전합니다.'],
    ['common','대학원 진학 계획이 있나요? (모범답 없음)','본인의 실제 계획을 숨기지 말고 일관되게 말하세요. 진학을 하려면 연구하고 싶은 주제와 이유, 진학하지 않는다면 학부 경험으로 충분히 직무를 수행할 수 있다는 근거를 준비합니다. 면접관은 입사 후 지속 의지를 확인하려는 경우가 많습니다.']
  ].map((r, i) => ({ id: 'q' + (i + 1), area: r[0], q: r[1], a: r[2] }));

  // 로드맵: 트랙별 체크리스트. type: course(과목) / skill(역량) / project(경험) / doc(준비)
  const ROAD = {
    process: [
      ['course', '반도체공학 / 반도체 소자 기초 과목 수강'], ['course', '반도체 공정(산화·증착·식각·포토·이온주입) 흐름 정리'],
      ['skill', '공정 변수와 결과의 관계(DOE, 통계적 공정 관리) 이해'], ['project', '공정 관련 실험·실습 또는 팹 견학·교육 경험'],
      ['skill', '엑셀·Python/JMP로 데이터 분석 기초'], ['doc', '지원 기업의 주력 공정(메모리/파운드리)과 최근 이슈 정리'],
      ['doc', '공정 기술면접 질문 20개 이상 답변 정리']
    ],
    device: [
      ['course', '반도체 소자 / 고체전자 과목 수강'], ['course', 'MOSFET 동작·단채널 효과·FinFET/GAA 정리'],
      ['skill', 'TCAD(Sentaurus 등) 또는 SPICE 시뮬레이션 경험'], ['project', '소자 특성 측정/분석 프로젝트 또는 연구실 인턴'],
      ['doc', '최신 논문(IEDM, VLSI) 요약 3편'], ['doc', '소자 면접 질문 20개 이상 정리']
    ],
    equipment: [
      ['course', '진공·플라즈마·열유체 등 장비 기초 과목'], ['skill', '반도체 공정 흐름과 장비 종류 구분'],
      ['skill', '회로·제어(센서, PLC, 계측) 기초'], ['project', '장비·메커트로닉스 관련 프로젝트 경험'],
      ['skill', '영어 의사소통(외국계 장비사 지원 시 중요)'], ['doc', '장비사 비즈니스 구조(고객사·서비스·PM) 이해']
    ],
    packaging: [
      ['course', '재료·열전달·기계/전기 기초 과목'], ['skill', '패키지 종류(WB, FC, FO, 2.5D/3D) 구분'],
      ['skill', '해석 툴(ANSYS 등) 또는 SI/PI 시뮬레이션 경험'], ['project', '패키징·신뢰성 관련 프로젝트'],
      ['doc', 'HBM·첨단 패키징 최근 동향 정리']
    ],
    design: [
      ['course', '디지털 논리회로 · 컴퓨터구조 수강'], ['course', 'VLSI/ASIC 설계 · 반도체 회로 수강'],
      ['skill', 'Verilog/SystemVerilog로 RTL 작성 (FIFO, FSM 등)'], ['skill', '시뮬레이션·합성 툴 사용(예: Vivado, Quartus, Synopsys)'],
      ['skill', 'Timing(STA), CDC, 저전력 개념 정리'], ['project', 'FPGA/ASIC 설계 프로젝트 1개 이상 (GitHub 정리)'],
      ['skill', 'UVM 기초 또는 검증 경험'], ['doc', '설계 면접 질문 30개 이상 정리']

    ],

/* 취업 준비 도구: 지원 현황 · 면접 준비(질문은행/로드맵/기업 노트) · 내 스펙·진로(갭 분석/취업 vs 대학원)
   데이터는 이 브라우저의 localStorage에만 저장됩니다. 백업(내보내기/가져오기) 기능 제공. */
(function () {
  const D = window.SEMI_PREP_DATA;
  const KEY = 'semihub.prep.v1';
  const noSync = () => location.protocol === 'file:';
  const STATUSES = ['관심', '준비중', '서류제출', '서류합격', '코테·인적성', '면접', '최종합격', '불합격'];
  let mem = null; // localStorage 불가 시 메모리 저장
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, x => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[x]));
  const safe = u => /^https?:\/\//i.test(String(u || '')) ? esc(u) : '#';
  const $ = id => document.getElementById(id);
  const blank = () => ({ _ts: 0, apps: [], qstat: {}, road: {}, notes: {}, ans: {}, spec: {}, career: {}, cover: [], profile: {}, exp: [], certs: [], grad: [], insight: {}, mock: {}, qsr: {}, tests: [] });

  function load() {
    if (mem) return mem;
    let d = null;
    try { d = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { d = null; }
    mem = Object.assign(blank(), d && typeof d === 'object' ? d : {});
    return mem;
  }
  // ---- 저장: localStorage(즉시) + 서버 파일(user_data.json, 로컬 서버 실행 시)
  let syncState = 'local', syncTimer = null, onAdopt = null, inited = false;
  const isEmpty = d => JSON.stringify(Object.assign(blank(), d, { _ts: 0 })) === JSON.stringify(blank());
  function badge() {
    const el = document.getElementById('ppSync');
    if (el) el.textContent = { synced: '서버 파일에 저장됨 (user_data.json, 매일 자동 백업)', local: '이 브라우저에만 저장 중 (로컬 서버로 접속하면 PC 파일에도 저장됩니다)', error: '서버 저장 실패 — 브라우저에는 저장됨. 서버가 켜져 있는지 확인하세요' }[syncState];
  }
  function adopt(d) {
    const m = load();
    Object.keys(m).forEach(k => delete m[k]);
    Object.assign(m, blank(), d);
    try { localStorage.setItem(KEY, JSON.stringify(m)); } catch (e) { /* ignore */ }
    if (onAdopt) onAdopt();
  }
  function push() {
    if (noSync()) return;
    fetch('/api/store', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: load() }) })
      .then(r => r.json().then(j => ({ s: r.status, j })))
      .then(x => { if (x.s === 200) syncState = 'synced'; else if (x.s === 409 && x.j && x.j.data) { adopt(x.j.data); syncState = 'synced'; } else syncState = 'error'; badge(); })
      .catch(() => { syncState = 'error'; badge(); });
  }
  function save() {
    const m = load(); m._ts = Date.now();
    let ok = true;
    try { localStorage.setItem(KEY, JSON.stringify(m)); } catch (e) { ok = false; }
    clearTimeout(syncTimer); syncTimer = setTimeout(push, 700);
    return ok;
  }
  function initSync() {
    if (inited || noSync()) return;
    inited = true;
    fetch('/api/store').then(r => r.json()).then(j => {
      const srv = (j && j.data) || {}, m = load();
      if (!isEmpty(srv) && (isEmpty(m) || (srv._ts || 0) > (m._ts || 0))) {
        if (!isEmpty(m)) { try { localStorage.setItem(KEY + '.replaced-backup', JSON.stringify(m)); } catch (e) { /* ignore */ } } // 덮어쓰기 전 로컬 사본 보관
        adopt(srv); syncState = 'synced';
      }
      else if (!isEmpty(m)) { if (!m._ts) m._ts = Date.now(); save(); }
      else syncState = 'synced';
      badge();
    }).catch(() => { syncState = 'error'; badge(); });
  }
  const S = () => load();

  const ui = { view: 'board', focus: '', cvq: '', prepTab: 'q', mineTab: 'profile', area: 'all', qmode: 'all', open: {}, role: '', noteCo: '', msg: '' };

  // ---------- 날짜
  const isoToday = () => { const n = new Date(); return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0'); };
  const INTERVALS = [0, 1, 3, 7, 14, 30]; // 알겠음을 누를수록 복습 간격이 늘어남(일)
  function schedule(id, known) {
    const s = S(), cur = s.qsr[id] || { box: 0 }, box = known ? Math.min(cur.box + 1, INTERVALS.length - 1) : 0;
    const d = new Date(); d.setDate(d.getDate() + INTERVALS[box]);
    s.qsr[id] = { box, due: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') };
  }
  const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  function dday(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ''));
    if (!m) return null;
    return Math.round((new Date(+m[1], +m[2] - 1, +m[3]) - today()) / 86400000);
  }
  const ddayLabel = n => n == null ? '마감일 없음' : n < 0 ? '마감 지남' : n === 0 ? 'D-DAY' : 'D-' + n;
  const FINAL = ['최종합격', '불합격'];
  const STAGES = ['서류', '인적성(GSAT 등)', '코딩테스트', '직무면접', '임원면접', '1차 면접', '2차 면접', '최종', '기타'];
  function dueSoon(days) {
    return S().apps.filter(a => !FINAL.includes(a.status) && ['관심', '준비중'].includes(a.status)).map(a => ({ a, d: dday(a.deadline) }))
      .filter(x => x.d != null && x.d >= 0 && x.d <= (days || 3)).sort((x, y) => x.d - y.d);
  }

  // ---------- 지원 현황
  function uid() { return 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function addApp(o) {
    const s = S();
    if (o.url && s.apps.some(a => a.url === o.url)) return false;
    s.apps.push({ id: uid(), company: o.company || '', title: o.title || '', url: o.url || '', deadline: o.deadline || '', status: o.status || '관심', memo: '', addedAt: new Date().toISOString().slice(0, 10) });
    save(); return true;
  }
  function tracked(url) { return !!url && S().apps.some(a => a.url === url); }

  function banner() {
    const due = dueSoon(3);
    if (!due.length) return '';
    return `<div class="note notice-warning pp-banner"><b>마감 임박 ${due.length}건</b> · ` + due.map(x => `${esc(x.a.company)} ${esc(x.a.title)} (${ddayLabel(x.d)})`).join(' / ') + ` <button class="button" data-nav="tracker">지원 현황 보기</button></div>`;
  }

  function trackerPage(ctx) {
    const s = S();
    const list = s.apps.slice().sort((a, b) => {
      const fa = FINAL.includes(a.status) ? 1 : 0, fb = FINAL.includes(b.status) ? 1 : 0;
      if (fa !== fb) return fa - fb;
      const da = dday(a.deadline), db = dday(b.deadline);
      return (da == null ? 9999 : da < 0 ? 5000 - da : da) - (db == null ? 9999 : db < 0 ? 5000 - db : db);
    });
    const count = st => s.apps.filter(a => a.status === st).length;
    const stats = STATUSES.map(st => `<span class="pill">${st} <b>${count(st)}</b></span>`).join('');
    const board = () => `<div class="kb">${STATUSES.map(st => {
      const items = list.filter(a => a.status === st);
      return `<div class="kb-col" data-kb-col="${st}"><div class="kb-head"><span>${st}</span><b>${items.length}</b></div>${items.map(a => {
        const d = dday(a.deadline), hot = d != null && d >= 0 && d <= 3;
        return `<div class="kb-card ${hot ? 'pp-hot' : ''}" draggable="true" data-kb="${esc(a.id)}"><div class="kb-top">${window.SEMI_VIS ? window.SEMI_VIS.avatar(a.company, 28) : ''}<div><b>${esc(a.company || '(회사 미입력)')}</b><div class="subtitle">${esc(String(a.title || '').slice(0, 28))}</div></div></div>
          <div class="kb-foot">${FINAL.includes(a.status) ? '' : `<span class="tag ${hot ? 'orange' : ''}">${ddayLabel(d)}</span>`}<select class="select kb-sel" data-app-status="${esc(a.id)}" title="상태 변경">${STATUSES.map(s2 => `<option ${s2 === a.status ? 'selected' : ''}>${s2}</option>`).join('')}</select><button class="button kb-more" data-kb-open="${esc(a.id)}" title="자세히">⋯</button></div></div>`;
      }).join('') || '<div class="kb-empty">비어 있음</div>'}</div>`;
    }).join('')}</div>`;
    const shown = ui.view === 'list' && ui.focus ? list.filter(a => a.id === ui.focus) : list;
    const rows = shown.map(a => {
      const d = dday(a.deadline), cls = d != null && d >= 0 && d <= 3 ? 'pp-hot' : d != null && d < 0 ? 'pp-past' : '';
      return `<article class="pp-card ${cls}" data-app="${esc(a.id)}">
        <div class="pp-card-top"><div class="pp-who">${window.SEMI_VIS ? window.SEMI_VIS.avatar(a.company, 30) : ''}<b>${esc(a.company || '(회사 미입력)')}</b> <span class="subtitle">${esc(a.title)}</span></div><span class="tag ${d != null && d >= 0 && d <= 3 ? 'orange' : ''}">${FINAL.includes(a.status) ? a.status : ddayLabel(d)}</span></div>
        <div class="pp-card-mid"><label>상태 <select class="select" data-app-status="${esc(a.id)}">${STATUSES.map(st => `<option ${st === a.status ? 'selected' : ''}>${st}</option>`).join('')}</select></label>
        <label>마감 <input class="select" type="date" value="${esc(a.deadline)}" data-app-deadline="${esc(a.id)}"></label>
        ${a.url ? `<a class="button" href="${safe(a.url)}" target="_blank" rel="noopener noreferrer">공고 ↗</a>` : ''}
        <button class="button" data-app-del="${esc(a.id)}">삭제</button></div>
        <details class="pp-stages" ${(a.stages || []).length ? 'open' : ''}><summary>전형 일정·시험·후기 (${(a.stages || []).length})</summary>
        ${(a.stages || []).map((st, i) => `<div class="pp-stage"><select class="select" data-st-name="${esc(a.id)}:${i}">${STAGES.map(n => `<option ${n === st.name ? 'selected' : ''}>${n}</option>`).join('')}</select><input class="select" type="date" value="${esc(st.date || '')}" data-st-date="${esc(a.id)}:${i}"><select class="select" data-st-res="${esc(a.id)}:${i}">${['대기', '합격', '불합격'].map(n => `<option ${n === (st.result || '대기') ? 'selected' : ''}>${n}</option>`).join('')}</select><button class="button" data-st-del="${esc(a.id)}:${i}">×</button><textarea class="select pp-memo" rows="2" placeholder="유형·후기·질문받은 것" data-st-note="${esc(a.id)}:${i}">${esc(st.note || '')}</textarea></div>`).join('')}
        <button class="button" data-st-add="${esc(a.id)}">+ 전형 단계 추가</button></details>
        ${window.SEMI_ME ? window.SEMI_ME.checklist(a) : ''}
        <textarea class="select pp-memo" rows="2" placeholder="메모 (준비할 것 등)" data-app-memo="${esc(a.id)}">${esc(a.memo)}</textarea></article>`;
    }).join('') || '<div class="empty">아직 추적 중인 공고가 없습니다. 채용공고 탭의 “지원 추적” 버튼이나 아래 폼으로 추가하세요.</div>';
    return ctx.header('지원 현황', '공고별 상태·마감 D-day를 한곳에서 관리합니다 (이 브라우저에 저장)') + banner() +
      `<div class="panel"><div class="tags">${stats}</div></div>
      <div class="panel"><h3>공고 직접 추가</h3><div class="filters">
        <input class="select" id="ppCo" placeholder="회사" style="flex:1 1 150px"><input class="select" id="ppTitle" placeholder="직무/공고명" style="flex:2 1 220px">
        <input class="select" id="ppUrl" placeholder="공고 링크(https://…)" style="flex:2 1 220px"><input class="select" id="ppDl" type="date" title="마감일">
        <button class="button primary" id="ppAdd">추가</button></div><div class="subtitle" id="ppAddMsg">${esc(ui.msg)}</div></div>
      <div class="filters"><button class="button" id="meIcs">📅 캘린더(.ics)로 내려받기</button><span class="subtitle">마감·전형일·대학원·점수 만료일이 구글/애플 캘린더에 들어갑니다</span></div>
      <div class="filters"><button class="button ${ui.view === 'board' ? 'primary' : ''}" data-kb-view="board">보드</button><button class="button ${ui.view === 'list' && !ui.focus ? 'primary' : ''}" data-kb-view="list">목록·상세</button>${ui.focus ? '<button class="button" data-kb-view="list">← 전체 목록</button>' : ''}<span class="subtitle">${ui.view === 'board' ? '카드를 끌어서 다른 열에 놓으면 상태가 바뀝니다 (모바일은 카드의 상태 선택 사용)' : ''}</span></div>
      ${ui.view === 'board' ? (s.apps.length ? board() : rows) : `<div class="pp-list">${rows}</div>`}` + backupPanel();
  }

  function backupPanel() {
    return `<div class="panel"><h3>내 데이터 백업</h3><div class="subtitle" id="ppSync"></div><div class="subtitle">로컬 서버(start_semihub)로 접속하면 모든 데이터가 PC의 user_data.json에 저장되고 하루 한 번 user_backups 폴더에 백업됩니다. 아래 백업 파일은 다른 PC로 옮길 때 쓰세요.</div>
      <div class="filters"><button class="button" id="ppExport">백업 파일 내려받기</button><label class="button">백업 파일 불러오기<input type="file" id="ppImport" accept="application/json" hidden></label></div><div class="subtitle" id="ppBackupMsg"></div></div>`;
  }

  // ---------- 면접 준비
  function tabs(cur, items, attr) {
    return `<div class="filters pp-tabs">${items.map(([k, l]) => `<button class="button ${cur === k ? 'primary' : ''}" ${attr}="${k}">${l}</button>`).join('')}</div>`;
  }

  function qPanel() {
    const s = S(); let qs = D.Q.filter(q => ui.area === 'all' || q.area === ui.area);
    const tdy = isoToday();
    if (ui.qmode === 'due') qs = qs.filter(q => (s.qsr[q.id] && s.qsr[q.id].due <= tdy) || (!s.qsr[q.id] && s.qstat[q.id] !== 'know'));
    if (ui.qmode === 'unknown') qs = qs.filter(q => s.qstat[q.id] !== 'know');
    if (ui.qmode === 'know') qs = qs.filter(q => s.qstat[q.id] === 'know');
    const known = D.Q.filter(q => s.qstat[q.id] === 'know').length;
    const areaOpts = `<option value="all">전체 분야</option>` + Object.keys(D.AREAS).map(k => `<option value="${k}" ${ui.area === k ? 'selected' : ''}>${D.AREAS[k]} (${D.Q.filter(q => q.area === k).length})</option>`).join('');
    const items = qs.map(q => {
      const st = s.qstat[q.id], open = !!ui.open[q.id];
      return `<article class="pp-card"><div class="pp-card-top"><b>${esc(q.q)}</b><span class="tag">${esc(D.AREAS[q.area])}</span></div>
        ${open ? `<p class="pp-answer">${esc(q.a)}</p>` : ''}
        <div class="pp-card-mid"><button class="button" data-q-toggle="${q.id}">${open ? '답 숨기기' : '답 보기'}</button>
        <button class="button ${st === 'know' ? 'primary' : ''}" data-q-mark="${q.id}:know">알겠음</button>
        <button class="button ${st === 'unknown' ? 'primary' : ''}" data-q-mark="${q.id}:unknown">모르겠음</button>${s.qsr[q.id] ? `<span class="tag">다음 복습 ${esc(s.qsr[q.id].due.slice(5))}</span>` : ''}</div>${window.SEMI_ME ? window.SEMI_ME.mockBox(q) : ''}</article>`;
    }).join('') || '<div class="empty">조건에 맞는 질문이 없습니다.</div>';
    return `<div class="note">개념 설명은 교재 수준의 일반 지식으로 정리한 것이며, 실제 면접 출제나 회사별 정답을 보장하지 않습니다. 먼저 스스로 답해본 뒤 “답 보기”를 누르세요. “모르겠음”만 모아 반복하세요. 진행 <b>${known}/${D.Q.length}</b></div>
      <div class="filters"><select class="select" id="ppArea">${areaOpts}</select>
      <select class="select" id="ppQmode"><option value="all" ${ui.qmode === 'all' ? 'selected' : ''}>전체</option><option value="due" ${ui.qmode === 'due' ? 'selected' : ''}>오늘 복습할 것</option><option value="unknown" ${ui.qmode === 'unknown' ? 'selected' : ''}>모르겠음·미확인만</option><option value="know" ${ui.qmode === 'know' ? 'selected' : ''}>알겠음만</option></select></div>${items}`;
  }

  function roleTracks() {
    const roles = (window.SEMI_ROLES && window.SEMI_ROLES.roles) || [];
    return roles;
  }
  function roadFor(track) { return (D.ROAD[track] || []).map((r, i) => ({ id: track + ':' + i, type: r[0], text: r[1] })); }
  const TYPE = { course: '수강', skill: '역량', project: '경험', doc: '정리' };

  function roadPanel() {
    const s = S(), roles = roleTracks();
    const tracks = Object.keys(D.ROAD);
    const label = { process: '공정', device: '소자', equipment: '장비', packaging: '패키징', design: '설계', analysis: '시험·분석·품질', data: '데이터·SW', materials: '소재·EHS' };

      <div class="panel"><h3>${label[cur]} 트랙 준비 체크리스트 <span class="tag">${done}/${items.length}</span></h3>
      <div class="pp-bar"><i style="width:${items.length ? Math.round(done / items.length * 100) : 0}%"></i></div>
      <div class="subtitle">${rl ? '관련 직무: ' + rl : ''}</div>
      ${items.map(i => `<label class="pp-check"><input type="checkbox" data-road="${i.id}" ${s.road[i.id] ? 'checked' : ''}><span class="tag">${TYPE[i.type]}</span> ${esc(i.text)}</label>`).join('')}
      <div class="subtitle" style="margin-top:10px">체크리스트는 일반적인 준비 항목이며, 지원 회사의 공고 요건을 최우선으로 하세요.</div></div>`;
  }

  function notesPanel() {
    const s = S(), cos = (window.SEMI_DB && window.SEMI_DB.companies) || [];
    const withNotes = Object.keys(s.notes).filter(k => (s.notes[k] || '').trim());
    const cur = ui.noteCo, c = cos.find(x => x.id === cur);
    return `<div class="filters"><input class="select" id="ppNoteSearch" list="ppCoList" placeholder="회사 이름으로 노트 열기" value="${esc(c ? c.name : '')}" style="flex:1 1 240px"><datalist id="ppCoList">${cos.map(x => `<option value="${esc(x.name)}">`).join('')}</datalist></div>
      ${c ? `<div class="panel"><h3>${esc(c.name)} 노트</h3><textarea class="select pp-memo" id="ppNote" rows="8" placeholder="지원 동기, 주력 제품/공정, 최근 이슈, 면접에서 말할 포인트, 궁금한 점…">${esc(s.notes[c.id] || '')}</textarea><div class="subtitle">입력하면 자동 저장됩니다.</div></div>` : '<div class="empty">회사를 선택하면 노트를 쓸 수 있습니다.</div>'}
      ${withNotes.length ? `<div class="panel"><h3>노트가 있는 회사</h3><div class="tags">${withNotes.map(id => { const co = cos.find(x => x.id === id); return `<button class="button" data-note-open="${esc(id)}">${esc(co ? co.name : id)}</button>`; }).join('')}</div></div>` : ''}`;
  }


  // ---------- 자소서 보관함
  const cnt = t => { const a = Array.from(String(t || '').replace(/\r\n/g, '\n')); return [a.length, a.filter(c => !/\s/.test(c)).length]; };
  function cvCounter(c) {
    const [w, n] = cnt(c.answer), lim = +c.limit || 0, over = lim && w > lim;
    return `<span class="${over ? 'pp-over' : ''}">공백 포함 <b>${w}</b>${lim ? ' / ' + lim : ''}자 · 공백 제외 <b>${n}</b>자${over ? ' · ' + (w - lim) + '자 초과' : ''}</span>`;
  }
  function cvItems() {
    const s = S(), q = (ui.cvq || '').trim().toLowerCase();
    const list = (s.cover || []).filter(c => !q || [c.company, c.question, c.answer].join(' ').toLowerCase().includes(q));
    return list.map(c => `<article class="pp-card" data-cv="${esc(c.id)}">
      <div class="pp-card-top"><div><b>${esc(c.company || '(회사 미입력)')}</b> <span class="subtitle">${esc(c.question)}</span></div><span class="subtitle" id="ppCnt-${esc(c.id)}">${cvCounter(c)}</span></div>
      <textarea class="select pp-memo" rows="8" data-cv-ans="${esc(c.id)}" placeholder="답변을 작성하세요">${esc(c.answer)}</textarea>
      <div class="pp-card-mid"><label>글자 수 제한 <input class="select" type="number" min="0" style="width:90px" value="${esc(c.limit)}" data-cv-limit="${esc(c.id)}"></label>
      ${(S().exp || []).length ? `<select class="select" data-cv-exp="${esc(c.id)}" style="max-width:190px"><option value="">경험 넣기…</option>${S().exp.map(e => `<option value="${esc(e.id)}">${esc(e.title)}</option>`).join('')}</select>` : ''}<button class="button" data-cv-copy="${esc(c.id)}">복사</button><button class="button" data-cv-del="${esc(c.id)}">삭제</button></div></article>`).join('')
      || '<div class="empty">' + (q ? '검색 결과가 없습니다.' : '아직 저장한 문항이 없습니다. 위에서 추가하세요.') + '</div>';

  const CDEF = { y1: 5000, y2: 6500, stipend: 1000, tuition: 0, grow: 0 };
  function careerCalc(c) {
    const o = Object.assign({}, CDEF, c), rows = []; let a = 0, b = 0, be = null;
    for (let t = 1; t <= 10; t++) {
      a += o.y1 * Math.pow(1 + o.grow / 100, t - 1);
      b += t <= 2 ? o.stipend - o.tuition : o.y2 * Math.pow(1 + o.grow / 100, t - 3);
      rows.push([t, Math.round(a), Math.round(b)]);
      if (be == null && b >= a) be = t;
    }
    return { rows, be };
  }

  function bindBackup() {

      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    };
    const im = $('ppImport');
    if (im) im.onchange = () => {
      const f = im.files && im.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        const msg = $('ppBackupMsg');
        try {
          const j = JSON.parse(rd.result);
          if (!j || j.app !== 'semihub-prep' || typeof j.data !== 'object') throw new Error('형식');
          if (!confirm('현재 저장된 데이터를 백업 파일 내용으로 바꿉니다. 계속할까요?')) return;

      <div class="filters"><input class="select" id="meCoSearch" list="meCoList" placeholder="기업 이름 검색 후 선택" style="flex:1 1 240px"><datalist id="meCoList">${cl.map(c => `<option value="${esc(c.name)}">`).join('')}</datalist></div>

      <div class="pp-card-mid"><button class="button" data-exp-del="${esc(e.id)}">삭제</button></div></article>`).join('') || '<div class="empty">아직 정리한 경험이 없습니다.</div>'}`;

  function certExpiry(c) {

    return `<div class="note">대학원(계약학과 포함) 지원 일정과 서류를 취업 일정과 따로 관리합니다. 마감일은 캘린더 파일에도 포함됩니다.</div>

  // ---------- 캘린더(.ics)
  function icsEvents() {
    const s = S(), ev = [];
    (s.apps || []).forEach(a => {
      const nm = (a.company || '') + ' ' + (a.title || '');
      if (a.deadline) ev.push([a.deadline, '[지원 마감] ' + nm]);
      (a.stages || []).forEach(st => { if (st.date) ev.push([st.date, '[' + (st.name || '전형') + '] ' + nm]); });
    });
    (s.grad || []).forEach(g => { if (g.deadline) ev.push([g.deadline, '[대학원 마감] ' + g.school + ' ' + g.program]); if (g.interview) ev.push([g.interview, '[대학원 면접] ' + g.school]); });
    (s.certs || []).forEach(c => { const ex = certExpiry(c); if (ex) ev.push([ex, '[점수 만료] ' + c.name + ' ' + (c.score || '')]); });
    return ev.filter(e => /^\d{4}-\d{2}-\d{2}/.test(e[0]));
  }
  const icsEsc = t => String(t).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  function fold(line) {
    const enc = new TextEncoder(); let out = '', cur = '', bytes = 0;
    for (const ch of line) { const b = enc.encode(ch).length; if (bytes + b > 70) { out += cur + '\r\n '; cur = ''; bytes = 1; } cur += ch; bytes += b; }
    return out + cur;
  }
  function buildICS() {
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');

    icsEvents().forEach((e, i) => {
      const d = e[0].slice(0, 10), next = new Date(d + 'T00:00:00'); next.setDate(next.getDate() + 1);
      lines.push('BEGIN:VEVENT', 'UID:semihub-' + i + '-' + d.replace(/-/g, '') + '@local', 'DTSTAMP:' + stamp, 'DTSTART;VALUE=DATE:' + d.replace(/-/g, ''), 'DTEND;VALUE=DATE:' + iso(next).replace(/-/g, ''), 'SUMMARY:' + icsEsc(e[1]),

    });
    lines.push('END:VCALENDAR');
    return lines.map(fold).join('\r\n') + '\r\n';
  }
  function downloadICS() {

      ...urgent.map(x => `<li>${av(x.a.company, 22)}<b>${esc(x.a.company)}</b> ${esc(x.a.title)} <span class="tag orange">${x.d === 0 ? 'D-DAY' : 'D-' + x.d}</span></li>`),

    const news = (window.SEMI_TECH_UI && window.SEMI_TECH_UI.items ? window.SEMI_TECH_UI.items(live) : []).map(n => ({ n, sc: matchNews(n, p) })).filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc || b.n.date.localeCompare(a.n.date)).slice(0, 3);

    const qs = dueQuestions(3);

    const nr = nextRoad(), certsSoon = (S().certs || []).map(c => ({ c, ex: certExpiry(c) })).filter(x => x.ex && dday(x.ex) != null && dday(x.ex) <= 90 && dday(x.ex) >= 0);
    parts.push(sec('다음 준비', `${nr ? `<p>로드맵 다음 항목<br><b>${esc(nr.text)}</b></p>` : '<p class="subtitle">프로필에서 관심 직무를 고르면 다음 준비 항목이 나옵니다.</p>'}${certsSoon.length ? `<p class="subtitle">점수 만료 임박: ${certsSoon.map(x => esc(x.c.name) + ' D-' + dday(x.ex)).join(', ')}</p>` : ''}`, 'mine'));

    const vis = window.SEMI_VIS ? window.SEMI_VIS.dashboard(window.SEMI_PREP.statuses) : '';

  // ---------- AI 호출
  function post(path, body) {

      .then(r => r.json().then(j => { if (!r.ok) throw new Error(j.error || ('오류 ' + r.status)); return j; }))

  // ---------- 지원 전 체크리스트 (지원 현황 카드 안)
  const CHECK_ITEMS = ['공고 요건(학력·전공·우대사항) 확인', '직무에 맞춘 자소서 작성', '자소서 글자 수·오탈자 검토', '증빙 서류(성적·졸업·어학) 준비', '어학 성적 유효기간 확인', '프로젝트·포트폴리오 정리', '지원서 최종 제출'];
  function checkHints(a) {
    const out = [], s = S(), co = norm(a.company);

    out.push(cv.length ? `자소서 보관함에 ${esc(a.company)} 항목 ${cv.length}개 (작성된 것 ${cv.filter(c => (c.answer || '').trim()).length}개)` : '자소서 보관함에 이 기업 항목이 없습니다');
    const cs = (s.certs || []).map(c => ({ c, ex: certExpiry(c) })).filter(x => x.ex);
    if (a.deadline && cs.length) {
      const bad = cs.filter(x => x.ex < a.deadline).map(x => x.c.name);

    } else if (!cs.length) out.push('등록된 어학·자격이 없습니다 (내 프로필·스펙 → 어학·자격)');

  // ---------- 시험 기록장 (인적성·코테)
  const TEST_KINDS = { 'GSAT(삼성)': ['언어논리', '수리논리', '추리', '시각적사고'], 'SKCT(SK)': ['언어이해', '자료해석', '창의수리', '언어추리', '수열추리'], '코딩테스트': ['구현', '그래프·탐색', 'DP', '자료구조', '수학', '문자열'], '기타': [] };
  const pct = (c, t) => t > 0 ? Math.round(c / t * 100) : null;
  function testStats(list) {
    const m = {};
    list.forEach(t => { const k = t.kind + ' · ' + (t.section || '전체'); const x = m[k] || (m[k] = { k, n: 0, c: 0, t: 0, min: 0 }); x.n++; x.c += +t.correct || 0; x.t += +t.total || 0; x.min += +t.minutes || 0; });
    return Object.values(m).map(x => Object.assign(x, { acc: pct(x.c, x.t), per: x.t ? Math.round(x.min * 60 / x.t) : null })).sort((a, b) => (a.acc == null ? 999 : a.acc) - (b.acc == null ? 999 : b.acc));
  }
  function testsPanel() {
    const list = (S().tests || []).slice().sort((a, b) => String(b.date).localeCompare(String(a.date))), st = testStats(list);
    const kind = ui.testKind || '코딩테스트';
    return `<div class="note">GSAT·SKCT·코딩테스트 결과를 영역별로 기록하면 <b>약한 영역</b>이 정답률 순으로 나옵니다. 영역 이름은 직접 입력해도 됩니다.</div>
    <div class="panel"><h3>시험 결과 추가</h3><div class="filters">
      <select class="select" id="meTKind">${Object.keys(TEST_KINDS).map(k => `<option ${k === kind ? 'selected' : ''}>${k}</option>`).join('')}</select>
      <input class="select" id="meTCo" placeholder="회사(선택)" style="flex:1 1 110px">
      <input class="select" id="meTDate" type="date" value="${iso(today())}">
      <input class="select" id="meTSec" list="meTSecList" placeholder="영역" style="flex:1 1 110px"><datalist id="meTSecList">${(TEST_KINDS[kind] || []).map(x => `<option value="${esc(x)}">`).join('')}</datalist>
      <input class="select" id="meTC" type="number" min="0" placeholder="맞은 수" style="width:90px"><input class="select" id="meTT" type="number" min="1" placeholder="전체 문항" style="width:100px"><input class="select" id="meTM" type="number" min="0" placeholder="걸린 분" style="width:90px">
      <input class="select" id="meTNote" placeholder="틀린 이유·메모" style="flex:2 1 200px"><button class="button primary" id="meTAdd">추가</button></div></div>

    <div class="panel"><h3>기록 (${list.length})</h3>${list.map(t => `<article class="pp-card"><div class="pp-card-top"><div><b>${esc(t.kind)}</b> <span class="subtitle">${esc(t.company || '')} ${esc(t.section || '')} · ${esc(t.date)}</span></div><span class="tag">${pct(+t.correct, +t.total) == null ? '-' : pct(+t.correct, +t.total) + '%'} (${esc(t.correct)}/${esc(t.total)})${t.minutes ? ' · ' + esc(t.minutes) + '분' : ''}</span></div>${t.note ? `<div class="subtitle">${esc(t.note)}</div>` : ''}<div class="pp-card-mid"><button class="button" data-test-del="${esc(t.id)}">삭제</button></div></article>`).join('') || '<div class="empty">기록이 없습니다.</div>'}</div>`;

  // ---------- 백업·복구
  function backupTab() {

      <div class="panel"><h3>파일로 내보내기 / 가져오기</h3><div class="filters"><button class="button" id="ppExport">백업 파일 내려받기</button><label class="button">백업 파일 불러오기<input type="file" id="ppImport" accept="application/json,.json" hidden></label></div><div class="subtitle" id="ppBackupMsg"></div>

</script><script>
/* SEMI-HUB AI Career Path · 뉴스 → 직무 → 실제 채용공고 → 역량 격차.

(() => {
'use strict';

const themePatterns={

 process:/공정|양산|process|manufactur|생산기술|yield|수율|fab|파운드리|foundry|production/i,

const themes=t=>Object.entries(themePatterns).filter(([,r])=>r.test(String(t||''))).map(([k])=>k);

function currentNews(live){const list=visibleNews(live);return list.find(n=>n.url===state.newsUrl)||list[0]||null}

 const nTags=themes([n?.title,n?.summary,n?.category].join(' '));
 const saved=profile().roles||[];
 return roles().map(r=>{const words=themes([r.name,r.tags,r.work,r.description].join(' '));let score=common(words,nTags).length*4;

  const name=norm(c.name);return name.length>=3 && (t.includes(name) || (name.includes('sk하이닉스')&&t.includes('sk hynix')) || (name.includes('삼성전자')&&t.includes('samsung electronics')));

function scoredJobs(live,n,r){

 const newsCompanies=namedCompanies(nText);const selectedCompany=companies().find(c=>c.id===state.company)?.name;
 const today=dateKST(),p=profile();

 .map(j=>{
  const text=[j.title,j.category,j.note].join(' '),jobTags=themes(text);
  const shared=common(nTags,jobTags),rShared=common(rTags,jobTags);
  const companyHit=newsCompanies.some(c=>norm(j.company).includes(norm(c))||norm(c).includes(norm(j.company)));
  const chosenCompany=selectedCompany && norm(j.company).includes(norm(selectedCompany));
  let score=shared.length*7+rShared.length*4+(companyHit?6:0)+(chosenCompany?2:0);
  if(state.role && rShared.length)score+=2;
  if((p.level==='신입')&&/경력/.test(j.level||'')&&!/신입/.test(j.level||''))score-=2;

  return {j,score,why:why.join(' · '),relevant,deadlinePassed:!!j.deadline&&j.deadline<today};
 }).filter(x=>x.relevant && x.score>=5)
 .sort((a,b)=>b.score-a.score||Number(a.deadlinePassed)-Number(b.deadlinePassed)||String(b.j.date||'').localeCompare(String(a.j.date||'')))

const cleanJob=x=>({title:x.j.title,company:x.j.company,date:x.j.date,source:x.j.source,url:x.j.url,category:x.j.category,level:x.j.level,deadline:x.j.deadline,note:x.j.note,match_reason:x.why,status:x.deadlinePassed?'마감일 경과':x.j.deadline?'마감일 미경과(접수 중 보장 아님)':'마감일 미확인'});

function formatted(text){
 const pattern=/^\s*(?:【|\[)?([1-5])[.)\]】]?\s*(?:[.、:]\s*)?[^\n]*$/gm;
 const lines=String(text||'').trim().split('\n');const sections=[];let current=null;
 for(const line of lines){const clean=line.trim();const m=clean.match(/^(?:#{1,3}\s*)?(?:【|\[)?([1-5])[.)\]】]?\s*(?:[.、:]\s*)?(.{2,80})$/);
  if(m&&(/뉴스|직무|채용|역량|준비|실천|이슈|행동/.test(m[2]))){if(current)sections.push(current);current={n:Number(m[1]),text:''};}
  else if(current)current.text+=(current.text?'\n':'')+line;
  else if(clean){if(!current)current={n:0,text:''};current.text+=(current.text?'\n':'')+line;}
 }
 if(current)sections.push(current);
 if(sections.filter(s=>s.n>0).length>=3)return `<div class="ca-result-chain">${sections.map(s=>`<section class="ca-result-step"><span class="ca-step">${String(s.n||'!').padStart(2,'0')}</span><div><h4>${esc(sectionTitles[s.n-1]||'추가 해설')}</h4><div class="ca-result-body">${esc(s.text||'해당 내용을 추가로 확인해 주세요.')}</div></div></section>`).join('')}</div>`;
 return `<div class="ca-analysis">${esc(text)}</div>`;
}

function bind(render,live){

 newsSearch.onkeydown=ev=>{if(ev.key==='Enter'&&!composing){ev.preventDefault();clearTimeout(filterTimer);refresh()}};
 }

 document.querySelectorAll('[data-ca-role]').forEach(b=>b.onclick=()=>{state.role=b.dataset.caRole;state.jobUrl='';state.jobText='';invalidate();render()});

  const e=evidence(live);if(!e.n){state.error='선택된 뉴스가 없습니다.';render();return}
  const id=++state.requestId;state.busy=true;state.error='';state.analysis=null;render();

   const response=await fetch('/api/ai/career',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
   const data=await response.json();if(!response.ok)throw Error(data.error||'AI 요청 실패');if(state.requestId!==id)return;
   state.analysis=data.analysis||'';state.sources={news:e.news,jobs:e.jobs,role:e.role};state.error='';
  }catch(err){if(state.requestId===id)state.error=String(err.message||err)}finally{if(state.requestId===id){state.busy=false;render();el('caAnalysis')?.scrollIntoView({behavior:'smooth',block:'start'})}}
 };
