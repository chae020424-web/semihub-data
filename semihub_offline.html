function companiesPage(){return header('반도체 기업 탐색','106개 대표 기업의 기술·제품·설비·연봉·사업장·출처를 한 번에 찾기')+filterControls()+`<div id="results">${companyResults()}</div>`+`<div class="note notice-warning">⚠️ 국내 전체 법인 전수 목록은 아니야. 검색되는 회사의 사업장도 전체 FAB 목록이 아닐 수 있어. <b>업종 모델 연봉은 해당 기업에서 확인된 연봉이 아니라 참고용 가상 구간</b>이야.</div>`}
function salaryTable(c){const p=c.salaryData;const stages=[['사원',.50,3302],['대리',.71,4354],['과장',.89,5251],['차장',1.08,5972],['부장',1.31,7770]];const base=p.avg??(p.low+p.high)/2;const lowWidth=p.avg!=null?.21:.32;let rows=stages.map(([grade,m,market])=>{let center=base*m;let low=center*(1-lowWidth),hi=center*(1+lowWidth);if(p.avg==null){low=Math.min(low,p.low*m);hi=Math.max(hi,p.high*m)}return `<tr><td><b>${grade}</b></td><td>${money(low)} ~ ${money(hi)}</td><td>${money(market)} <span class="muted tiny">(전체기업 통계)</span></td></tr>`}).join('');return `<table class="paytable"><thead><tr><th>직급</th><th>예상 세전 연간 총보수 범위</th><th>잡코리아 직급 평균</th></tr></thead><tbody>${rows}</tbody></table><div class="note notice-warning"><b>직급별 숫자는 실측 데이터가 아니야.</b> 공시 평균 또는 업종 가정을 바탕으로 직급별 가중치(사원 0.50 · 대리 0.71 · 과장 0.89 · 차장 1.08 · 부장 1.31)를 임의 적용한 시나리오야. 성과급·주식보상·근속·직군·기업 규모에 따라 실제 급여는 크게 달라져. <a class="link" href="https://www.jobkorea.co.kr/Salary/" target="_blank" rel="noopener noreferrer">잡코리아의 전체 직급별 통계 확인 ↗</a></div>`}
function detail(){const c=companies.find(x=>x.id===state.companyId);if(!c)return companiesPage();const p=c.salaryData;return header('기업 상세','원문에 근거한 정보와 추정치를 분리하여 보여줍니다')+`<button class="button" data-nav="companies">← 기업 목록</button><div class="panel"><div class="detailhero"><div class="logo" style="width:66px;height:66px;font-size:21px">${esc(c.logo)}</div><div><h2>${esc(c.name)}</h2><p>${esc(c.country)} · ${esc(c.segment)} · ${esc(c.focus)}</p></div></div><p class="subtitle" style="margin:20px 0">${esc(c.description)}</p><div class="tags"><span class="tag ${verified(c)?'green':p.avg!=null?'blue':'orange'}">${esc(p.type)}</span><span class="tag">연봉 ${esc(p.year)}년 기준</span></div><div class="detailstats"><div class="inset"><small>연간 직원 평균 · 추정 범위</small><b>${pay(c)}</b></div><div class="inset"><small>2025년 매출 · 억원</small><b>${c.revenueEok!=null?Math.round(c.revenueEok).toLocaleString('ko-KR')+'억':'미확인'}</b></div></div><div class="note">${esc(p.basis)}${c.note?'<br>'+esc(c.note):''}<br>매출은 연결·별도 재무제표 기준에 따라 집계 범위가 다를 수 있어.</div></div><div class="mini-grid"><div class="panel"><h3>⚙ 주력 기술 · 제품 / 장비</h3>${T('전문 분야',c.focus)}${T('대표 제품 / 장비',c.products)}<div class="note">장비명은 해당 업체의 대표 제품군을 뜻하고, 반드시 점유율 1위라는 의미는 아님.</div></div><div class="panel"><h3>📍 본사·연구소·FAB / 사업장</h3>${c.locations.length?c.locations.map(l=>`<div class="location"><h4>${esc(l.name)}</h4><p>${esc(l.region)} · ${esc(l.type)}</p></div>`).join(''):'<div class="empty">사업장 위치 확인 전</div>'}<div class="note notice-warning">거점 개요만 확인됐어. 장비·소재 기업의 사무실을 반도체 웨이퍼 FAB로 간주하지 않아.</div></div></div><div class="panel"><h3>₩ 직급별 연봉 참고 범위 (사원 → 부장)</h3>${salaryTable(c)}</div><div class="mini-grid"><div class="panel"><h3>▣ 채용 공고 연결</h3><p class="subtitle">공식 사이트에 현재 공고가 있을 때 확인할 수 있어. 링크 자체는 채용 중이라는 증거가 아니야.</p><a class="button primary" target="_blank" rel="noopener noreferrer" href="${URLsafe(c.career||c.homepage)}">${c.career?'채용 사이트 열기':c.homepage?.includes('kind.krx.co.kr')?'공식 기업정보 열기':'회사 공식 사이트 열기'} ↗</a><p class="subtitle">신규 채용 인원: 공식 집계 확인 전.</p>${c.historicalRecruitment?.length?'<div class="source-item"><b>확인된 과거 모집 공고</b></div>'+c.historicalRecruitment.map(r=>`<div class="source-item"><a class="link" target="_blank" rel="noopener noreferrer" href="${URLsafe(r.source)}">${esc(r.year)} · ${esc(r.label)} ↗</a></div>`).join(''):''}</div><div class="panel"><h3>⌁ 근거 및 검증 상태</h3><p class="subtitle">연봉 기준: ${esc(p.basis)}</p><a class="link" target="_blank" rel="noopener noreferrer" href="${URLsafe(p.sourceUrl)}">연봉 출처 · ${esc(p.sourceLabel)} ↗</a>${c.sources.slice(0,7).map(s=>`<div class="source-item"><a class="link" href="${URLsafe(s.url)}" rel="noopener noreferrer" target="_blank">${esc(s.label)} ↗</a></div>`).join('')}</div></div>`}
function home(){let count=(liveData.news||[]).length,jobs=(liveData.jobs||[]).length;return header('오늘의 취업 준비','내 프로필 기준으로 지금 필요한 것만 모았습니다')+window.SEMI_ME.today(liveData)+`<div class="hero"><div class="eyebrow">SEMI-HUB · COMPANY INTELLIGENCE</div><h2>반도체 회사와 직무를,<br>한곳에서 탐색하다.</h2><p>채용 링크부터 주요 장비·제품, 사업장, 연봉과 반도체 직무까지. 공시 수치와 추정치는 색상으로 구분하고 클릭하면 출처를 보여줘.</p><button class="button primary" data-nav="roles">반도체 직무 탐색·적합도 검사 →</button></div>${stats()}<div class="section"><div class="section-head"><h2>주요 기업 분석</h2><button class="button" data-nav="companies">전체 보기 →</button></div><div class="grid">${['삼성전자','SK하이닉스','SEMES','원익IPS','한미반도체','앰코테크놀로지코리아'].map(n=>companies.find(c=>c.name===n)).filter(Boolean).map(card).join('')}</div></div><div class="mini-grid"><div class="panel"><div class="section-head"><h3>오늘의 수집 정보</h3><button class="button" data-nav="news">소식 보기</button></div>${T('기업 관련 뉴스',count+'건')}${T('고용24 검증 공고',jobs+'건')}${T('수집 상태',liveData.lastSuccess?'최신 캐시 있음':'첫 실행 대기')}<p class="subtitle">고용24 공고는 인증키 연결 시에만 수집돼. 매일 12시 수집은 PC 작업 스케줄러를 설정해야 해.</p></div><div class="panel"><h3>데이터 기준</h3><p class="subtitle">● <b>공시 요약</b> : 2025년 공시 기반 제3자 추출, 2차 검증 권장</p><p class="subtitle">● <b>통계 추정</b> : 사람인 등 서비스 자체 추정 평균</p><p class="subtitle">● <b>업종 모형</b> : 회사별 확인 자료가 없는 경우 국내 임금참고 모형</p><button class="button" data-nav="sources">검증·출처 읽기 →</button></div></div>`}
function salaries(){const actual=[...companies].filter(c=>c.salaryData.avg!=null).sort((a,b)=>b.salaryData.avg-a.salaryData.avg);const estimate=[...companies].filter(c=>c.salaryData.avg==null).sort((a,b)=>a.name.localeCompare(b.name,'ko'));const row=(c)=>`<tr><td><b>${esc(c.name)}</b></td><td>${pay(c)}</td><td><span class="tag ${verified(c)?'green':c.salaryData.avg!=null?'blue':'orange'}">${esc(c.salaryData.type)}</span></td><td><button class="button" data-open="${esc(c.id)}">사원~부장 →</button></td></tr>`;const headerRow='<thead><tr><th>회사</th><th>연간 평균 / 업종 추정 구간</th><th>자료 성격</th><th>상세</th></tr></thead>';return header('연봉 비교','106개 기업 전체 · 공시 평균과 업종 가정치를 명확히 구분')+`<div class="note notice-warning"><b>주의:</b> 회사별 평균 연봉은 신입 초봉이나 특정 직급 연봉이 아니야. 아래 주황색 업종 추정 구간은 해당 회사의 실제 급여가 아니라 교육용 가정치야. 사원~부장 금액도 회사에서 확인된 것이 아니라 <b>시나리오</b>로 계산했어.</div><div class="panel"><div class="section-head"><h3>공시·외부 통계 기반 연간 평균 (${actual.length}개 회사)</h3></div><table class="list-table">${headerRow}<tbody>${actual.map(row).join('')}</tbody></table></div><div class="panel"><div class="section-head"><h3>업종 기반 참고 구간 (${estimate.length}개 회사)</h3></div><p class="subtitle">개별 기업 공시/통계 연봉이 확인되지 않아 업종별 가정치로 표시한 영역이야. 여기의 범위는 기업 간 보상 수준 순위가 아니야.</p><table class="list-table">${headerRow}<tbody>${estimate.map(row).join('')}</tbody></table></div>`}

function products(){return header('반도체 제품·장비','장비명과 주요 공정으로 기업을 탐색하고 어떤 회사가 강한지 비교')+`<div class="note">장비 분야와 모델명은 대표 제품군을 나타내며 장비별 실제 세계 시장점유율은 개별 자료 검증 전이므로 제공하지 않아.</div>${filterControls()}<div id="results">${companyResults()}</div>`}
function newsCards(type){let a=(type==='jobs'?liveData.jobs:liveData.news)||[];if(!a.length)return `<div class="empty">${type==='jobs'?'검증된 채용 공고가 아직 없어. 고용24 API 키가 필요해.':'최근 수집된 뉴스가 없어. 로컬 서버에서 「지금 업데이트」를 눌러 확인해.'}</div>`;return a.slice(0,150).map(p=>`<article class="news-card"><span class="tag ${type==='jobs'?'green':'blue'}">${type==='jobs'?'고용24 API':'Google 뉴스 RSS'}</span><h4>${esc(p.title)}</h4><p>${esc([p.company,p.date,p.source].filter(Boolean).join(' · '))}</p><a href="${URLsafe(p.url)}" target="_blank" rel="noopener noreferrer">${type==='jobs'?'채용 원문':'기사 보기'} ↗</a></article>`).join('')}
function recruit(){return window.SEMI_JOBS_UI.page(liveData,companies)}
function careerRows(q){return companies.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())).map(c=>`<div class="rowlist"><div><b>${esc(c.name)}</b><p class="subtitle" style="margin:3px 0">${esc(c.country)} · ${esc(c.segment)}</p></div><a class="button" target="_blank" rel="noopener noreferrer" href="${URLsafe(c.career||c.homepage)}">${c.career?'채용 경로':'회사 사이트'} ↗</a></div>`).join('')||'<div class="empty">검색 결과 없음</div>'}
function news(){return header('최근 반도체 기술 소식','6시간마다(0·6·12·18시 KST) 뉴스 RSS 수집 · 서버 및 인터넷 연결 필요')+`<div class="toolbar"><p class="subtitle">마지막 성공 ${esc(liveData.lastSuccess||'없음')} · 최근 뉴스 ${(liveData.news||[]).length}건</p><button class="button primary" data-refresh>↻ 지금 업데이트</button></div><div class="note">언론사 기사 전문을 복제하지 않고 RSS의 제목·기사 링크·발행일만 보관해. 매일 12시에 수집이 <b>시작</b>되며 네트워크 상황에 따라 완료는 늦어질 수 있어.</div><div class="panel">${newsCards('news')}</div>`}
function sources(){return header('데이터 출처·추정 기준','출처 없이 만들어진 기업별 연봉이나 채용 인원을 실제 수치로 안내하지 않습니다')+`<div class="panel"><h3>연봉은 세 단계로 구분</h3>${T('공시 요약','2025 사업보고서 기반 제3자 집계 (DART에서 원문 검증 가능)')}${T('외부 통계','사람인 추정 2025 · 표본·방법론 별도')}${T('업종 모형','회사별 자료 없는 경우 업종 가정으로 만든 참고 구간')}${T('직급별 범위','실측이 아닌 알고리즘 예시 (실제 회사별 사원·부장 연봉 아님)')}<p class="subtitle">한국 회사 2025 매출액은 연결(CFS) 또는 별도(OFS) 재무제표 수치로 기준이 다를 수 있어. 사원·대리·과장·차장·부장 연봉은 잡코리아의 일반 직급별 평균을 참고해 가중치 모델로 계산한 것이야. 해외 기업의 업종 추정은 세계 현지 급여가 아니라 <b>한국 근무 가정치</b>야.</p><div class="note notice-warning">기본 업종 모형은 실제 회사의 채용·보상 자료를 조사한 것이 아니므로, 기업별 오퍼를 예측하거나 비교 순위를 매길 근거로 활용하면 안 돼.</div></div><div class="panel"><h3>대표 출처</h3>${[['DART 공식 공시 원문','https://dart.fss.or.kr/'],['OpenDART 직원현황 API','https://opendart.fss.or.kr/guide/detail.do?apiGrpCd=DS002&apiId=2019011'],['2025년 기업별 연봉·인원 DART 재구성 표','https://www.flashmemory.co.kr/companies/compare/?id=wonik-ips'],['국내 소재·장비사 DART 요약','https://bonuschip.app/guides/korea-semiconductor-suppliers-pay'],['외부 기업 연봉 통계 — 사람인','https://www.saramin.co.kr/'],['직급별 일반 연봉 통계 — 잡코리아','https://www.jobkorea.co.kr/Salary/'],['고용24 공식 채용 API','https://www.work24.go.kr/cm/e/a/0110/selectOpenApiSvcInfo.do?fullApiSvcId=000000000000000000000000000000'],['Google 뉴스 RSS','https://news.google.com/rss?hl=ko&gl=KR&ceid=KR:ko']].map(([n,url])=>`<div class="source-item"><a class="link" href="${URLsafe(url)}" target="_blank" rel="noopener noreferrer">${esc(n)} ↗</a></div>`).join('')}</div><div class="panel"><h3>매일 12시 자동 갱신 범위</h3><p class="subtitle"><b>자동 수집:</b> Google 뉴스 RSS 기업 관련 기사, 고용24 승인 API 연결 시 등록 공고. <b>수동 검증:</b> 연봉·사업장·FAB·채용 규모. 하루마다 수치가 바뀌는 것이 아니며, 새로운 공시가 게시되면 별도 검토해야 해.</p><p class="subtitle">매일 12시 갱신은 Windows 작업 스케줄러 등록과 PC 전원·인터넷 연결이 필요해. 로컬 HTML 단독 실행은 자동으로 파일을 다시 쓰지 못해.</p></div>`}
function render(){const views={home,companies:companiesPage,roles:window.SEMI_ROLES_UI.page,salaries,products,recruit,news:()=>window.SEMI_TECH_UI.page(liveData),tracker:()=>window.SEMI_PREP.pages.tracker({header}),prep:()=>window.SEMI_PREP.pages.prep({header}),mine:()=>window.SEMI_PREP.pages.mine({header}),careerai:()=>window.SEMI_CAREER_AI.page({header,live:liveData}),sources,detail};$('app').innerHTML=`<div class="layout"><aside class="sidebar"><div class="brand"><span class="brandmark">S</span>SEMI-HUB</div>${nav.map(([id,icon,label])=>id==='_'?`<div class="navgroup">${label}</div>`:`<button class="nav ${state.page===id||state.page==='detail'&&id==='companies'?'active':''}" data-nav="${id}"><i>${(window.SEMI_VIS&&window.SEMI_VIS.icon(id))||icon}</i><span>${label}</span></button>`).join('')}<div class="sidebarfoot">반도체 취업 준비생을 위한<br>기업 데이터 인사이트<br><br>LOCAL · v7.7 / KST</div></aside><main class="main">${(views[state.page]||home)()}<div class="footer">SEMI-HUB v6.0 · 개인 교육용 로컬 서비스 · 공개 자료 요약 및 모델 참고 범위 · 직무 적합도는 진로 탐색용 · 자동 갱신은 뉴스·승인된 채용 API에 한정<br>기업별 정보의 실제성과 최신성을 확인하려면 각 기업의 채용·공시·공식 사이트를 확인하세요.</div></main></div>`;bind()}
function bind(){window.__semiLive=liveData;window.SEMI_PREP.bind(render,state.page);window.SEMI_PREP.bindAnswer();if(state.page!=='mine')window.SEMI_ME.bind(render,null);if(state.page==='news')window.SEMI_TECH_UI.bind(liveData,render);if(state.page==='roles')window.SEMI_ROLES_UI.bind(render);if(state.page==='recruit')window.SEMI_JOBS_UI.bind(render,liveData,companies);if(state.page==='careerai')window.SEMI_CAREER_AI.bind(render,liveData);document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>{state.page=el.dataset.nav;state.companyId=null;if(el.dataset.modeled)state.salaryScope='modeled';render();window.scrollTo(0,0)}));document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>{state.companyId=el.dataset.open;state.page='detail';render();window.scrollTo(0,0)}));for(const id of ['search','country','sector','sort','salaryScope']){const el=$(id);if(el)el.addEventListener(id==='search'?'input':'change',()=>{state[id==='search'?'q':id]=el.value;$('results').innerHTML=companyResults();bindResults()})}const f=$('careerSearch');if(f)f.addEventListener('input',()=>{$('careerRows').innerHTML=careerRows(f.value)});document.querySelectorAll('[data-refresh]').forEach(el=>el.addEventListener('click',()=>refreshNow()))}
function bindResults(){document.querySelectorAll('#results [data-open]').forEach(el=>el.addEventListener('click',()=>{state.companyId=el.dataset.open;state.page='detail';render();window.scrollTo(0,0)}))}
async function loadLive(){if(location.protocol==='file:'){return}try{let resp=await fetch('/api/live',{cache:'no-store'});if(!resp.ok)return;liveData=await resp.json();if(['home','news','recruit','careerai'].includes(state.page))render()}catch(e){}}
async function refreshNow(){if(location.protocol==='file:'){alert('단일 HTML은 오프라인 보기만 가능해. 로컬 서버를 실행하면 인터넷 수집을 쓸 수 있어.');return}try{let r=await fetch('/api/update',{method:'POST'});if(!r.ok)throw Error('실패');alert('자료 수집을 시작했어. 잠시 뒤 갱신 상태가 바뀌면 화면에 반영돼.')}catch(e){alert('로컬 서버 연결 실패: run_windows.bat으로 실행했는지 확인해.')}}
async function loadArchive(){if(location.protocol==='file:')return;try{const r=await fetch('/api/technews',{cache:'no-store'});if(!r.ok)return;const data=await r.json();window.SEMI_TECH_UI.setArchive(data);if(['news','careerai'].includes(state.page))render()}catch(e){}}
window.SEMIHUB={render,refreshNow};render();loadLive();loadArchive();if(location.protocol!=='file:')setInterval(()=>{if(!state.working){loadLive();if(state.page==='news')loadArchive()}},25*1000);
})();

</script></body></html>
