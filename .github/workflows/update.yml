name: SEMI-HUB 자동 수집 (6시간마다)

on:
  schedule:
    - cron: '5 3,9,15,21 * * *'   # UTC 기준 = 한국시간 12:05, 18:05, 00:05, 06:05
  workflow_dispatch:               # Actions 탭에서 「Run workflow」로 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: semihub-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 브라우저(Playwright) 설치 - ASML·TEL 수집용
        run: |
          pip install playwright
          playwright install --with-deps chromium
        continue-on-error: true      # 실패해도 나머지 수집은 계속

      - name: 수집 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # 선택: 없으면 AI 분석만 건너뜀
          TZ: Asia/Seoul
        run: python updater.py --force

      - name: 결과 저장(커밋)
        run: |
          git config user.name  "semihub-bot"
          git config user.email "semihub-bot@users.noreply.github.com"
          git add live.json news_archive.json news_state.json career_watch.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "auto: 데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
